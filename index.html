/* ---- Build the Model sheet's year columns (0 to 10) ---------------------- */
(function buildModel(){
  const s = SHEETS.find(x => x.name === 'Model');
  const YC = ['D','E','F','G','H','I','J','K','L','M'];
  const esc = 'Assumptions!C18';

  s.cells['C6']  = { v:0, f:'num0', c:'hdr ctr' };
  s.cells['C26'] = { v:'=-Assumptions!C34', f:'num1' };

  YC.forEach((cl, i) => {
    const prev = i ? YC[i - 1] : null;
    s.cells[cl + '6']  = { v:i + 1, f:'num0', c:'hdr ctr' };
    s.cells[cl + '7']  = { v:'=Assumptions!C33', f:'num1' };
    s.cells[cl + '8']  = prev ? { v:`=${prev}8*(1+${esc})`, f:'num2' } : { v:'=Assumptions!C17', f:'num2' };
    s.cells[cl + '9']  = { v:`=${cl}7*1000*${cl}8/1000000`, f:'num1' };
    s.cells[cl + '10'] = prev ? { v:`=${prev}10*(1+${esc})`, f:'num1' } : { v:'=-Assumptions!C38', f:'num1' };
    s.cells[cl + '11'] = prev ? { v:`=${prev}11*(1+${esc})`, f:'num1' } : { v:'=-Assumptions!C39', f:'num1' };
    s.cells[cl + '12'] = { v:`=SUM(${cl}9:${cl}11)`, f:'num1', c:'subtot' };
    s.cells[cl + '13'] = { v:`=${cl}12/${cl}9`, f:'pct0' };
    s.cells[cl + '14'] = { v:'=-Assumptions!C37', f:'num1' };
    s.cells[cl + '15'] = { v:`=${cl}12+${cl}14`, f:'num1', c:'subtot' };
    s.cells[cl + '16'] = { v:`=-${cl}12/${cl}14`, f:'x2' };
    s.cells[cl + '17'] = { v:`=1/(1+Assumptions!C27)^${cl}6`, f:'num3' };

/* ════════════════════════════════════════════════════════════════════════
   2. FORMULA ENGINE
   ════════════════════════════════════════════════════════════════════════ */

const SHEET_BY_NAME = Object.fromEntries(SHEETS.map(s => [s.name, s]));
const overrides = Object.create(null);   /* "Sheet!REF" -> number typed by the visitor */
let cache = new Map();
const evalStack = new Set();

const EPOCH = Date.UTC(1899, 11, 30);
const serial = (y, m, d) => Math.round((Date.UTC(y, m - 1, d) - EPOCH) / 864e5);
const fromSerial = s => new Date(EPOCH + Math.round(s) * 864e5);
const todaySerial = () => { const n = new Date(); return serial(n.getFullYear(), n.getMonth() + 1, n.getDate()); };

const colLetter = i => { let s = '', n = i + 1; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const colIndex = L => { let n = 0; for (const ch of L) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };

/* ---- tokenizer ---- */
const RE_NUM  = /^\d+(?:\.\d+)?/;
const RE_STR  = /^"([^"]*)"/;
const RE_REF  = /^(?:([A-Za-z][A-Za-z0-9_]*)!)?\$?([A-Z]{1,2})\$?(\d{1,4})(?![A-Za-z0-9_])/;
const RE_ID   = /^[A-Za-z][A-Za-z0-9_.]*/;
const RE_OP   = /^(<=|>=|<>|[+\-*/^&(),:<>=])/;

function tokenize(src) {
  const out = [];
  let s = src;
  while (s.length) {
    if (/^\s/.test(s)) { s = s.replace(/^\s+/, ''); continue; }
    let m;
    if ((m = RE_STR.exec(s))) { out.push({ t: 'str', v: m[1] }); s = s.slice(m[0].length); continue; }
    if ((m = RE_NUM.exec(s))) { out.push({ t: 'num', v: parseFloat(m[0]) }); s = s.slice(m[0].length); continue; }
    if ((m = RE_REF.exec(s))) { out.push({ t: 'ref', sheet: m[1] || null, col: m[2], row: +m[3] }); s = s.slice(m[0].length); continue; }
    if ((m = RE_ID.exec(s)))  { out.push({ t: 'id', v: m[0].toUpperCase() }); s = s.slice(m[0].length); continue; }
    if ((m = RE_OP.exec(s)))  { out.push({ t: 'op', v: m[0] }); s = s.slice(m[0].length); continue; }
    throw new Error('#SYNTAX!');
  }
  return out;
}

/* ---- functions ---- */
const flat = args => args.flatMap(a => Array.isArray(a) ? a : [a]);
const nums = args => flat(args).filter(v => typeof v === 'number' && isFinite(v));

const FN = {
  SUM:  a => nums(a).reduce((x, y) => x + y, 0),
  COUNT:a => nums(a).length,
  AVERAGE: a => { const n = nums(a); return n.length ? n.reduce((x, y) => x + y, 0) / n.length : 0; },
  MAX:  a => { const n = nums(a); return n.length ? Math.max(...n) : 0; },
  MIN:  a => { const n = nums(a); return n.length ? Math.min(...n) : 0; },
  ABS:  a => Math.abs(+a[0]),
  ROUND:a => { const p = Math.pow(10, a[1] === undefined ? 0 : +a[1]); return Math.round(+a[0] * p) / p; },
  IF:   a => (a[0] ? a[1] : a[2] !== undefined ? a[2] : false),
  REPT: a => String(a[0]).repeat(Math.max(0, Math.min(200, Math.round(+a[1] || 0)))),
  TODAY:() => todaySerial(),
  DATE: a => serial(+a[0], +a[1], +a[2]),
  YEAR: a => fromSerial(+a[0]).getUTCFullYear(),
  MONTH:a => fromSerial(+a[0]).getUTCMonth() + 1,
  YEARFRAC: a => (+a[1] - +a[0]) / 365.25,
  SUMPRODUCT: a => {
    const arrs = a.map(x => Array.isArray(x) ? x : [x]);
    const len = Math.min(...arrs.map(x => x.length));
    let total = 0;
    for (let i = 0; i < len; i++) total += arrs.reduce((p, x) => p * (typeof x[i] === 'number' ? x[i] : 0), 1);
    return total;
  },
  COUNTIF: a => {
    const range = Array.isArray(a[0]) ? a[0] : [a[0]];
    const crit = String(a[1]).toLowerCase();
    return range.filter(v => String(v).toLowerCase() === crit).length;
  },
  /* level payment on an amortising loan, returned positive */
  PMT: a => {
    const r = +a[0], n = +a[1], pv = +a[2];
    if (!isFinite(r) || !isFinite(n) || n <= 0) return NaN;
    return r === 0 ? pv / n : pv * r / (1 - Math.pow(1 + r, -n));
  },
  /* Excel convention: cash flows begin at the end of period 1 */
  NPV: a => {
    const r = +a[0];
    return nums(a.slice(1)).reduce((s, c, i) => s + c / Math.pow(1 + r, i + 1), 0);
  },
  /* bisection; cash flows begin at period 0 */
  IRR: a => {
    const cf = nums(a);
    if (cf.length < 2) return NaN;
    const npv = r => cf.reduce((s, c, i) => s + c / Math.pow(1 + r, i), 0);
    let lo = -0.9999, hi = 10, flo = npv(lo), fhi = npv(hi);
    if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return NaN;
    for (let i = 0; i < 200; i++) {
      const mid = (lo + hi) / 2, f = npv(mid);
      if (f === 0) return mid;
      if (flo * f < 0) { hi = mid; fhi = f; } else { lo = mid; flo = f; }
    }
    return (lo + hi) / 2;
  },
};

/* ---- recursive-descent parser / evaluator ---- */
function evaluate(src, ctxSheet) {
  const tk = tokenize(src);
  let p = 0;
  const peek = () => tk[p];
  const isOp = v => peek() && peek().t === 'op' && peek().v === v;
  const eat = v => { if (!isOp(v)) throw new Error('#SYNTAX!'); p++; };

  function primary() {
    const t = peek();
    if (!t) throw new Error('#SYNTAX!');
    if (t.t === 'num' || t.t === 'str') { p++; return t.v; }
    if (t.t === 'op' && t.v === '(') { p++; const v = expr(); eat(')'); return v; }
    if (t.t === 'op' && t.v === '-') { p++; return -primary(); }
    if (t.t === 'op' && t.v === '+') { p++; return primary(); }
    if (t.t === 'ref') {
      p++;
      if (isOp(':') && tk[p + 1] && tk[p + 1].t === 'ref') {
        p++;
        const b = tk[p++];
        return readRange(t, b, ctxSheet);
      }
      return readCell(t.sheet || ctxSheet, t.col + t.row);
    }
    if (t.t === 'id') {
      p++;
      const name = t.v;
      if (!isOp('(')) throw new Error('#NAME?');
      eat('(');
      const args = [];
      if (!isOp(')')) { args.push(expr()); while (isOp(',')) { p++; args.push(expr()); } }
      eat(')');
      const fn = FN[name];
      if (!fn) throw new Error('#NAME?');
      return fn(args);
    }
    throw new Error('#SYNTAX!');
  }
  function power()  { let v = primary(); while (isOp('^')) { p++; v = Math.pow(v, primary()); } return v; }
  function term()   { let v = power(); while (isOp('*') || isOp('/')) { const o = peek().v; p++; const r = power(); v = o === '*' ? v * r : (r === 0 ? NaN : v / r); } return v; }
  function add()    { let v = term(); while (isOp('+') || isOp('-')) { const o = peek().v; p++; const r = term(); v = o === '+' ? v + r : v - r; } return v; }
  function concat() { let v = add(); while (isOp('&')) { p++; v = fmtConcat(v) + fmtConcat(add()); } return v; }
  function expr() {
    let v = concat();
    while (peek() && peek().t === 'op' && ['<', '>', '=', '<=', '>=', '<>'].includes(peek().v)) {
      const o = peek().v; p++; const r = concat();
      v = o === '<' ? v < r : o === '>' ? v > r : o === '=' ? v === r
        : o === '<=' ? v <= r : o === '>=' ? v >= r : v !== r;
    }
    return v;
  }
  const result = expr();
  if (p !== tk.length) throw new Error('#SYNTAX!');
  return result;
}

const fmtConcat = v => typeof v === 'number' ? group(v, Math.abs(v % 1) > 1e-9 ? 1 : 0) : String(v);

function readRange(a, b, ctxSheet) {
  const sheet = a.sheet || ctxSheet;
  const c1 = colIndex(a.col), c2 = colIndex(b.col);
  const r1 = a.row, r2 = b.row;
  const out = [];
  for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++)
    for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++)
      out.push(readCell(sheet, colLetter(c) + r));
  return out;
}

function rawOf(sheetName, ref) {
  const key = sheetName + '!' + ref;
  if (key in overrides) return overrides[key];
  const sh = SHEET_BY_NAME[sheetName];
  if (!sh) return '';
  const cell = sh.cells[ref];
  return cell ? cell.v : '';
}

function readCell(sheetName, ref) {
  const key = sheetName + '!' + ref;
  if (cache.has(key)) return cache.get(key);
  if (evalStack.has(key)) throw new Error('#CIRC!');
  const raw = rawOf(sheetName, ref);
  let val;
  if (raw === '' || raw === null || raw === undefined) val = 0;
  else if (typeof raw === 'number') val = raw;
  else if (typeof raw === 'string' && raw[0] === '=') {
    evalStack.add(key);
    try { val = evaluate(raw.slice(1), sheetName); }
    catch (e) { val = (e && /^#/.test(e.message)) ? e.message : '#ERROR!'; }
    finally { evalStack.delete(key); }
  } else val = raw;
  cache.set(key, val);
  return val;
}

/* ════════════════════════════════════════════════════════════════════════
   3. NUMBER FORMATTING
   ════════════════════════════════════════════════════════════════════════ */

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function group(v, dec) {
  const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  /* a residual that rounds to zero is zero — never show it in parentheses */
  const neg = v < 0 && parseFloat(s.replace(/,/g, '')) !== 0;
  return neg ? '(' + s + ')' : s;
}

function formatValue(v, f) {
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (typeof v === 'string') return v;
  if (v === null || v === undefined) return '';
  if (typeof v !== 'number' || !isFinite(v)) return '—';
  switch (f) {
    case 'yr':   return String(Math.round(v));
    case 'num0': return group(v, 0);
    case 'num1': return group(v, 1);
    case 'num2': return group(v, 2);
    case 'num3': return group(v, 3);
    case 'x2':   return group(v, 2) + 'x';
    case 'pct0': return group(v * 100, 0) + '%';
    case 'pct1': return group(v * 100, 1) + '%';
    case 'usd':  return '$' + group(v, 0);
    case 'date': { const d = fromSerial(v); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
    case 'mmmyy':{ const d = fromSerial(v); return MONTHS[d.getUTCMonth()] + '-' + String(d.getUTCFullYear()).slice(2); }
    case 'yr2':  return String(fromSerial(v).getUTCFullYear());
    default:     return group(v, Math.abs(v % 1) > 1e-9 ? 1 : 0);
  }
}

/* ════════════════════════════════════════════════════════════════════════
   4. RENDER
   ════════════════════════════════════════════════════════════════════════ */

const viewport = document.getElementById('viewport');
const tabbar   = document.getElementById('tabbar');
const namebox  = document.getElementById('namebox');
const formula  = document.getElementById('formula');

const state = { sheet: SHEETS[0].name, ref: 'B2', editing: false };
const grids = {};   /* sheet -> { el, map: {ref: td}, cellAt: [r][c] -> td, rows, cols } */

function buildSheet(sh) {
  const table = document.createElement('table');
  table.dataset.sheet = sh.name;

  const cg = document.createElement('colgroup');
  const head = document.createElement('col'); head.style.width = '34px'; cg.appendChild(head);
  sh.cols.forEach(w => { const c = document.createElement('col'); c.style.width = w + 'px'; cg.appendChild(c); });
  table.appendChild(cg);

  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  const corner = document.createElement('th'); corner.className = 'colhead corner'; hr.appendChild(corner);
  sh.cols.forEach((_, i) => { const th = document.createElement('th'); th.className = 'colhead'; th.textContent = colLetter(i); hr.appendChild(th); });
  thead.appendChild(hr); table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const map = {}, cellAt = [];
  for (let r = 1; r <= sh.rows; r++) {
    const tr = document.createElement('tr');
    const th = document.createElement('th'); th.className = 'rowhead'; th.textContent = r; tr.appendChild(th);
    cellAt[r] = [];
    let skip = 0;
    for (let c = 0; c < sh.cols.length; c++) {
      const ref = colLetter(c) + r;
      if (skip > 0) { skip--; cellAt[r][c] = cellAt[r][c - 1]; continue; }
      const def = sh.cells[ref];
      const td = document.createElement('td');
      td.className = 'cell';
      td.dataset.ref = ref;
      td.dataset.sheet = sh.name;
      if (def) {
        if (def.c)  td.className += ' ' + def.c;
        if (def.input)  td.className += ' in';
        if (def.action) td.dataset.action = def.action;
        if (def.span && def.span > 1) {
          const span = Math.min(def.span, sh.cols.length - c);
          td.colSpan = span;
          skip = span - 1;
        }
      }
      tr.appendChild(td);
      map[ref] = td;
      cellAt[r][c] = td;
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  grids[sh.name] = { el: table, map, cellAt, rows: sh.rows, cols: sh.cols.length };
  return table;
}

function paint() {
  cache = new Map();
  for (const sh of SHEETS) {
    const g = grids[sh.name];
    for (const ref in g.map) {
      const td = g.map[ref];
      if (td.dataset.editing === '1') continue;
      const def = sh.cells[ref];
      const val = readCell(sh.name, ref);
      const raw = rawOf(sh.name, ref);
      const isNum = typeof val === 'number';
      const text = (raw === '' || raw === null || raw === undefined) ? '' : formatValue(val, def && def.f);

      td.classList.toggle('rt', isNum && !(def && /ctr/.test(def.c || '')));

      if (def && def.href) {
        td.textContent = '';
        const a = document.createElement('a');
        a.href = def.href;
        a.textContent = text;
        if (/^https?:/.test(def.href)) { a.target = '_blank'; a.rel = 'noopener'; }
        td.appendChild(a);
      } else {
        td.textContent = text;
      }
    }
  }
}

function buildTabs() {
  SHEETS.forEach(sh => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.type = 'button';
    b.role = 'tab';
    b.textContent = sh.name;
    b.dataset.sheet = sh.name;
    b.addEventListener('click', () => showSheet(sh.name));
    tabbar.appendChild(b);
  });
  const status = document.createElement('div');
  status.className = 'status';
  status.id = 'status';
  tabbar.appendChild(status);
}

function showSheet(name) {
  state.sheet = name;
  for (const sh of SHEETS) grids[sh.name].el.style.display = (sh.name === name ? '' : 'none');
  tabbar.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.sheet === name)));
  select(name, firstContentRef(name), false);
  viewport.scrollTop = 0;
  viewport.scrollLeft = 0;
}

function firstContentRef(name) {
  const refs = Object.keys(SHEET_BY_NAME[name].cells);
  return refs.length ? refs[0] : 'A1';
}

/* ════════════════════════════════════════════════════════════════════════
   5. SELECTION, EDITING, KEYBOARD
   ════════════════════════════════════════════════════════════════════════ */

function tdFor(sheet, ref) { return grids[sheet].map[ref]; }

function select(sheet, ref, scroll = true) {
  const prev = tdFor(state.sheet, state.ref);
  if (prev) prev.classList.remove('sel');
  state.sheet = sheet; state.ref = ref;
  const td = tdFor(sheet, ref);
  if (!td) return;
  td.classList.add('sel');
  if (scroll) td.scrollIntoView({ block: 'nearest', inline: 'nearest' });

  namebox.textContent = ref;
  const raw = rawOf(sheet, ref);
  const isF = typeof raw === 'string' && raw[0] === '=';
  formula.textContent = raw === '' ? '' : String(raw);
  formula.classList.toggle('is-formula', isF);

  const val = readCell(sheet, ref);
  const status = document.getElementById('status');
  if (status) {
    const def = SHEET_BY_NAME[sheet].cells[ref];
    status.textContent = typeof val === 'number'
      ? 'Value: ' + formatValue(val, def && def.f)
      : (def && def.input ? 'Editable input' : 'Ready');
  }
}

function positionOf(sheet, ref) {
  const g = grids[sheet];
  for (let r = 1; r <= g.rows; r++)
    for (let c = 0; c < g.cols; c++)
      if (g.cellAt[r][c] && g.cellAt[r][c].dataset.ref === ref) return { r, c };
  return { r: 1, c: 0 };
}

function move(dr, dc, jump) {
  if (state.editing) return;
  const g = grids[state.sheet];
  let { r, c } = positionOf(state.sheet, state.ref);
  const steps = jump ? 200 : 1;
  let last = null;
  for (let i = 0; i < steps; i++) {
    const nr = r + dr, nc = c + dc;
    if (nr < 1 || nr > g.rows || nc < 0 || nc >= g.cols) break;
    r = nr; c = nc;
    const td = g.cellAt[r][c];
    if (jump && td && td.textContent.trim() !== '') { last = td; break; }
    last = td;
  }
  if (last && last.dataset.ref) select(state.sheet, last.dataset.ref);
}

function beginEdit(prefill) {
  const sh = SHEET_BY_NAME[state.sheet];
  const def = sh.cells[state.ref];
  if (!def || !def.input) return;
  const td = tdFor(state.sheet, state.ref);
  const key = state.sheet + '!' + state.ref;
  const current = (key in overrides) ? overrides[key] : def.v;

  state.editing = true;
  td.dataset.editing = '1';
  td.textContent = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'decimal';
  input.value = prefill !== undefined ? prefill : String(current);
  td.appendChild(input);
  input.focus();
  if (prefill === undefined) input.select();

  const finish = commit => {
    if (!state.editing) return;
    state.editing = false;
    delete td.dataset.editing;
    if (commit) {
      const n = parseFloat(String(input.value).replace(/[, %]/g, ''));
      if (isFinite(n)) overrides[key] = n;
    }
    input.remove();
    paint();
    select(state.sheet, state.ref, false);
  };

  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter')      { finish(true);  move(1, 0, false); }
    else if (e.key === 'Tab')   { e.preventDefault(); finish(true); move(0, 1, false); }
    else if (e.key === 'Escape'){ finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

function resetAssumptions() {
  for (const k in overrides) delete overrides[k];
  paint();
  select(state.sheet, state.ref, false);
}

/* ---- events ---- */
viewport.addEventListener('mousedown', e => {
  const td = e.target.closest('td.cell');
  if (!td) return;
  if (e.target.tagName === 'A') return;
  if (td.dataset.action === 'reset') { e.preventDefault(); resetAssumptions(); return; }
  if (td.dataset.editing === '1') return;
  select(td.dataset.sheet, td.dataset.ref);
});

viewport.addEventListener('dblclick', e => {
  const td = e.target.closest('td.cell');
  if (td && td.classList.contains('in')) { select(td.dataset.sheet, td.dataset.ref); beginEdit(); }
});

document.addEventListener('keydown', e => {
  if (state.editing) return;
  if (e.target.closest && e.target.closest('.tabbar')) return;   /* keep tabs keyboard-reachable */
  const jump = e.ctrlKey || e.metaKey;
  switch (e.key) {
    case 'ArrowUp':    e.preventDefault(); move(-1, 0, jump); return;
    case 'ArrowDown':  e.preventDefault(); move(1, 0, jump);  return;
    case 'ArrowLeft':  e.preventDefault(); move(0, -1, jump); return;
    case 'ArrowRight': e.preventDefault(); move(0, 1, jump);  return;
    case 'Tab':        e.preventDefault(); move(0, e.shiftKey ? -1 : 1, false); return;
    case 'Enter':      e.preventDefault(); beginEdit(); return;
    case 'F2':         e.preventDefault(); beginEdit(); return;
    case 'PageDown':   e.preventDefault(); move(15, 0, false); return;
    case 'PageUp':     e.preventDefault(); move(-15, 0, false); return;
  }
  if (e.key === 'Home') { e.preventDefault(); select(state.sheet, firstContentRef(state.sheet)); return; }
  /* typing a digit over a blue cell starts an edit, like a real spreadsheet */
  if (!jump && /^[0-9.\-]$/.test(e.key)) { e.preventDefault(); beginEdit(e.key); }
});

/* ---- boot ---- */
SHEETS.forEach(sh => viewport.appendChild(buildSheet(sh)));
buildTabs();
paint();
showSheet(SHEETS[0].name);
</script>
</body>
</html>

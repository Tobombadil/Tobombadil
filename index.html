<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrew T. Gibson — Energy Project Finance</title>
<meta name="description" content="Andrew T. Gibson — energy project finance, transaction structuring and underwriting. Denver, CO. A personal site built in the language of a financial model, with a live illustrative deal.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fbfbf9'/%3E%3Cpath d='M2 4h12M2 8h12M2 12h12M6 2v12M10 2v12' stroke='%23d8d8d2' stroke-width='1'/%3E%3Crect x='6' y='4' width='4' height='4' fill='%231a3fcf' opacity='.8'/%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   A website in the language of a financial model.

   The page commits to a single visual world on purpose: a banker's working
   paper is white paper, and inverting it would break the conceit. Every
   colour is an explicit token and the body paints its own ground, so the
   page holds whatever theme the host is in.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#ffffff;
  --paper-2:#faf9f6;      /* warm-biased neutral: printed stock, not screen grey */
  --chrome:#f4f4f1;
  --rule:#dcdcd6;
  --rule-2:#eceae4;
  --ink:#16181a;
  --ink-2:#55595e;
  --ink-3:#83878c;
  --input:#1a3fcf;        /* modelling convention: hardcoded input */
  --linkc:#0a7040;        /* modelling convention: link to another schedule */
  --series-1:#2a78d6;
  --series-2:#eb6834;
  --good:#0ca30c;
  --shade:#f6f1dd;
  --maxw:1120px;
  --sans:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --serif:Georgia,"Times New Roman",Times,serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:104px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 var(--sans);
  font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
  /* faint worksheet ruling: the page reads as squared paper, not as a grid */
  background-image:linear-gradient(var(--rule-2) 1px,transparent 1px),
                   linear-gradient(90deg,var(--rule-2) 1px,transparent 1px);
  background-size:100% 28px,28px 100%;
  background-position:-1px -1px;
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

/* ── toolbar + formula bar ─────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:40;background:var(--chrome);border-bottom:1px solid var(--rule)}
.bar-in{max-width:var(--maxw);margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:18px;height:38px}
.fname{font:700 11px var(--sans);letter-spacing:.045em;white-space:nowrap}
.fname span{color:var(--ink-3);font-weight:400}
nav{margin-left:auto;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{display:block;padding:11px 13px;font:11px var(--sans);color:var(--ink-2);text-decoration:none;
      border-left:1px solid var(--rule);white-space:nowrap}
nav a:last-child{border-right:1px solid var(--rule)}
nav a:hover{color:var(--ink);background:var(--paper)}
nav a.on{color:var(--ink);font-weight:700;background:var(--paper);box-shadow:inset 0 -2px 0 var(--linkc)}
nav a:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--input);outline-offset:2px}

.fbar{position:sticky;top:38px;z-index:39;background:var(--paper);border-bottom:1px solid var(--rule)}
.fbar-in{max-width:var(--maxw);margin:0 auto;padding:0 22px;display:flex;align-items:stretch;height:30px}
.fref{flex:0 0 96px;display:flex;align-items:center;font:700 11px var(--sans);color:var(--ink-2);
      border-right:1px solid var(--rule)}
.ffx{flex:0 0 30px;display:flex;align-items:center;justify-content:center;
     font:italic 700 12px var(--serif);color:var(--ink-3);border-right:1px solid var(--rule)}
.ftext{flex:1 1 auto;display:flex;align-items:center;padding:0 11px;min-width:0;
       font:11px/1 var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftext.live{color:#7a2f8a}

/* ── section furniture ─────────────────────────────────────────────── */
section{padding:52px 0 4px}
.shead{display:flex;align-items:baseline;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:6px;margin-bottom:22px}
.shead h2{margin:0;font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.shead .idx{font:400 10px var(--mono);color:var(--ink-3);letter-spacing:.04em}
.shead .rt{margin-left:auto;font:italic 11px var(--sans);color:var(--ink-3)}

/* ── hero ──────────────────────────────────────────────────────────── */
.hero{padding:46px 0 8px;display:grid;grid-template-columns:1.55fr 1fr;gap:44px;align-items:start}
.eyebrow{font:700 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:10px 0 0;font:400 46px/1.06 var(--serif);letter-spacing:-.012em;text-wrap:balance}
.role{margin:12px 0 0;font:400 17px/1.4 var(--serif);color:var(--ink-2);font-style:italic;text-wrap:balance}
.lede{margin:20px 0 0;max-width:60ch;font-size:14.5px;line-height:1.62;color:#2c3034}
.cta{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border:1px solid var(--rule);
     background:var(--paper);color:var(--ink);font:12px var(--sans);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--ink-3);background:var(--paper-2)}
.btn.primary{background:var(--input);border-color:var(--input);color:#fff}
.btn.primary:hover{background:#1535ad;border-color:#1535ad}

.cover{border:1px solid var(--rule);background:var(--paper)}
.cover h3{margin:0;padding:9px 13px;background:var(--chrome);border-bottom:1px solid var(--rule);
          font:700 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.crow{display:flex;gap:14px;padding:8px 13px;border-bottom:1px solid var(--rule-2);font-size:12.5px}
.crow:last-child{border-bottom:0}
.crow dt{flex:1 1 auto;margin:0;color:var(--ink-2)}
.crow dd{flex:0 0 auto;margin:0;text-align:right}
.legend{padding:10px 13px;border-top:1px solid var(--rule);background:var(--paper-2)}
.legend p{margin:0 0 5px;font:700 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.legend li{list-style:none;font-size:11.5px;color:var(--ink-2);line-height:1.7}
.legend ul{margin:0;padding:0}
.legend b{font-weight:700}

/* ── stat tiles ────────────────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--rule);background:var(--paper)}
.tile{padding:15px 16px;border-right:1px solid var(--rule)}
.tile:last-child{border-right:0}
.tile .k{font:700 9.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
         display:block;margin-bottom:7px}
.tile .v{font:400 27px/1 var(--serif);letter-spacing:-.01em;display:block}
.tile .u{font-size:11px;color:var(--ink-2);margin-top:5px;display:block}
.tiles.sub .tile .v{font-size:21px}

/* ── ruled data rows ───────────────────────────────────────────────── */
.sched{width:100%;border-collapse:collapse;font-size:13px}
.sched th{font:700 10.5px var(--sans);letter-spacing:.05em;text-align:left;color:var(--ink-2);
          border-bottom:1px solid var(--ink-3);padding:0 10px 6px 0;white-space:nowrap}
.sched td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule-2);vertical-align:top;line-height:1.45}
.sched td.n,.sched th.n{text-align:right;white-space:nowrap}
.sched tbody tr:hover{background:var(--paper-2)}
.sched .desc{color:var(--ink-2);font-size:12.5px}
.chip{display:inline-block;padding:2px 7px;border:1px solid var(--rule);background:var(--paper-2);
      font:10.5px var(--sans);color:var(--ink-2);white-space:nowrap}
.chip.live{border-color:#b9c6f2;background:#eef2ff;color:var(--input)}

/* ── experience ────────────────────────────────────────────────────── */
.roles{display:flex;flex-direction:column;gap:0}
.job{padding:20px 0;border-bottom:1px solid var(--rule-2)}
.job:last-child{border-bottom:0}
.job-h{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline}
.job h3{margin:0;font:700 16px var(--sans)}
.job .co{margin:2px 0 0;font:italic 13.5px var(--serif);color:var(--ink-2)}
.job .when{text-align:right;font-size:12px;color:var(--ink-2);white-space:nowrap}
.job .when b{display:block;font:400 15px var(--serif);color:var(--ink)}
.tbar{height:5px;background:var(--rule-2);margin:11px 0 13px;position:relative}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);display:block}
.job ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.job li{padding-left:15px;position:relative;font-size:13.5px;line-height:1.55;color:#2c3034;max-width:78ch}
.job li::before{content:"—";position:absolute;left:0;color:var(--ink-3)}

/* ── the live model ────────────────────────────────────────────────── */
.model{display:grid;grid-template-columns:300px 1fr;gap:0;border:1px solid var(--rule);background:var(--paper)}
.inputs{border-right:1px solid var(--rule);background:var(--paper-2)}
.inputs h3,.outputs h3{margin:0;padding:10px 14px;background:var(--chrome);border-bottom:1px solid var(--rule);
        font:700 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);
        display:flex;justify-content:space-between;align-items:center;gap:10px}
.reset{appearance:none;border:0;background:none;padding:0;cursor:pointer;
       font:400 10px var(--sans);letter-spacing:.02em;text-transform:none;color:var(--linkc);text-decoration:underline}
.fld{padding:11px 14px;border-bottom:1px solid var(--rule-2)}
.fld:last-child{border-bottom:0}
.fld-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.fld label{font-size:12px;color:var(--ink-2)}
.fld output{font:700 13px var(--sans);color:var(--input);font-variant-numeric:tabular-nums}
.fld .u{font-weight:400;font-size:10.5px;color:var(--ink-3);margin-left:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--rule);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--rule);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;
  border-radius:50%;background:var(--input);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--input);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:2px solid var(--paper);border-radius:50%;
  background:var(--input);box-shadow:0 0 0 1px var(--input)}
.outputs{min-width:0}
.otiles{display:grid;grid-template-columns:repeat(4,1fr)}
.otile{padding:14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.otile:nth-child(4){border-right:0}
.otile .k{font:700 9.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block}
.otile .v{font:400 26px/1.15 var(--serif);display:block;margin-top:6px}
.otile .n{font-size:10.5px;color:var(--ink-3);display:block;margin-top:3px}
.otile .v.neg{color:#b3312f}
.viz{padding:16px 14px 6px}
.viz + .viz{border-top:1px solid var(--rule)}
.viz h4{margin:0 0 2px;font:700 12px var(--sans)}
.viz .cap{margin:0 0 12px;font:italic 11px var(--sans);color:var(--ink-3);line-height:1.45}
.legend-row{display:flex;gap:16px;margin:0 0 10px;font-size:11px;color:var(--ink-2)}
.legend-row span{display:flex;align-items:center;gap:6px}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
.chartbox{overflow-x:auto}
svg.chart{display:block;min-width:440px;width:100%;height:auto}
.tick{font:10px var(--sans);fill:var(--ink-3)}
.axis{stroke:var(--rule);stroke-width:1}
.gridline{stroke:var(--rule-2);stroke-width:1}
.tie{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--rule);
     background:var(--paper-2);font-size:12px;color:var(--ink-2)}
.tie b{color:var(--good);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.tie b.bad{color:#b3312f}

/* sensitivity heatmap */
table.heat{border-collapse:separate;border-spacing:2px;font-size:11.5px;margin:0 auto}
table.heat th{font:700 10px var(--sans);color:var(--ink-2);padding:3px 5px;white-space:nowrap}
table.heat th.corner{font:italic 9.5px var(--sans);color:var(--ink-3);text-align:right}
table.heat td{padding:9px 6px;text-align:right;min-width:56px;cursor:default;
              font-variant-numeric:tabular-nums;border-radius:2px}
table.heat td.base{outline:2px solid var(--ink);outline-offset:-2px}
.heatwrap{overflow-x:auto;padding-bottom:4px}

/* tooltip */
.tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;
     background:#1c1e20;color:#fff;padding:7px 9px;font:11px/1.5 var(--sans);max-width:230px;
     box-shadow:0 3px 12px rgba(0,0,0,.24)}
.tip.on{opacity:1}
.tip b{display:block;font-size:11px;margin-bottom:3px}
.tip i{font-style:normal;color:#b9bcc0}

/* ── two-column lists ──────────────────────────────────────────────── */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:38px}
.blk h3{margin:0 0 10px;font:700 12px var(--sans)}
.deflist{margin:0;font-size:13px}
.deflist div{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--rule-2)}
.deflist dt{flex:0 0 34%;margin:0;color:var(--ink-2)}
.deflist dd{flex:1 1 auto;margin:0}
.paper{border:1px solid var(--rule);background:var(--paper);padding:16px 18px}
.paper h3{margin:0 0 4px;font:700 14px var(--sans)}
.paper .cap{margin:0 0 12px;font:italic 11.5px var(--sans);color:var(--ink-3)}
.paper p{margin:0 0 10px;font-size:13.5px;line-height:1.6;color:#2c3034;max-width:72ch}
.paper p:last-child{margin-bottom:0}

/* ── contact + footer ──────────────────────────────────────────────── */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:start}
a.mail{color:var(--linkc);text-decoration:underline;text-underline-offset:2px}
footer{margin-top:56px;border-top:1px solid var(--rule);background:var(--paper-2)}
footer .wrap{padding-top:20px;padding-bottom:26px}
footer p{margin:0 0 6px;font:italic 11px var(--sans);color:var(--ink-3);line-height:1.6;max-width:86ch}

/* input groups, elections and the held-constant list */
  .igrp{border-bottom:1px solid var(--rule)}
  .igh{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
       background:none;border:0;padding:9px 14px;cursor:pointer;text-align:left;color:var(--ink-2);
       font:700 9.5px var(--sans);letter-spacing:.11em;text-transform:uppercase}
  .igh:hover{color:var(--ink)}
  .igh .chev{font-size:9px;color:var(--ink-3);transition:transform .16s}
  .igrp[data-open="0"] .chev{transform:rotate(-90deg)}
  .igrp[data-open="0"] .igb{display:none}
  .igb{padding-bottom:4px}
  .fld select{width:100%;font:12px var(--sans);padding:5px 6px;border:1px solid var(--rule);
              background:var(--paper);color:var(--input);font-weight:700}
  .held{padding:12px 14px;border-top:1px solid var(--rule);background:var(--paper)}
  .held p{margin:0 0 6px;font:700 9.5px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
  .held ul{margin:0;padding:0;list-style:none}
  .held li{font-size:11px;color:var(--ink-2);line-height:1.75}

  /* capital stack strip */
  .stack{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule)}
  .sitem{padding:10px 14px;border-right:1px solid var(--rule)}
  .sitem:last-child{border-right:0}
  .sitem .k{display:block;font:700 9px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
  .sitem .v{display:block;font:400 16px var(--serif);margin-top:3px}

  /* stress table */
  table.stress{font-size:12.5px;min-width:430px}
  table.stress td{padding:7px 10px 7px 0}
  table.stress tr.key{background:var(--paper-2)}
  table.stress tr.key td{font-weight:700}
  table.stress td.muted{color:var(--ink-3)}
  table.stress td.bad{color:#b3312f}
  #stress{overflow-x:auto;padding-bottom:4px}

  /* values wired to the workbook get a quiet affordance */
[data-cell]{cursor:help;text-decoration:underline;text-decoration-style:dotted;
            text-decoration-color:var(--rule);text-underline-offset:3px}
[data-cell]:hover,[data-cell]:focus-visible{text-decoration-color:var(--ink-3)}
.calc{color:var(--ink)}
.link{color:var(--linkc)}
.hard{color:var(--input)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:960px){
  .hero{grid-template-columns:1fr;gap:30px}
  .model{grid-template-columns:1fr}
  .inputs{border-right:0;border-bottom:1px solid var(--rule)}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tile:nth-child(2){border-right:0}
  .tile:nth-child(1),.tile:nth-child(2){border-bottom:1px solid var(--rule)}
  .cols,.contact{grid-template-columns:1fr;gap:26px}
}
@media (max-width:680px){
  html{scroll-padding-top:96px}
  .wrap{padding:0 15px}
  .bar-in,.fbar-in{padding:0 15px}
  h1{font-size:33px}
  .role{font-size:15px}
  section{padding:38px 0 4px}
  .otiles{grid-template-columns:repeat(2,1fr)}
  .otile:nth-child(2){border-right:0}
  .fref{flex-basis:74px;font-size:10px}
  .tiles.sub{grid-template-columns:repeat(2,1fr)}
  .tiles.sub .tile:nth-child(1),.tiles.sub .tile:nth-child(2){border-bottom:1px solid var(--rule)}
  .job-h{grid-template-columns:1fr}
  .job .when{text-align:left}
  .job .when b{display:inline;margin-right:7px}
  .deflist div{flex-direction:column;gap:2px}
  .deflist dt{flex-basis:auto}
  .sched thead{display:none}
  .sched tr{display:block;padding:12px 0;border-bottom:1px solid var(--rule-2)}
  .sched td{display:block;border:0;padding:1px 0}
  .sched td.n{text-align:left}
  .sched td[data-l]::before{content:attr(data-l) " ";color:var(--ink-3);font-size:11px}
}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <span class="fname">ATG_OPERATING_MODEL_v1.0 <span>· base case</span></span>
    <nav id="nav" aria-label="Sections"></nav>
  </div>
</div>

<div class="fbar">
  <div class="fbar-in">
    <div class="fref" id="fref">—</div>
    <div class="ffx" aria-hidden="true">fx</div>
    <div class="ftext" id="ftext">Hover any calculated figure to read the formula behind it</div>
  </div>
</div>

<main id="main"></main>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════
   1. THE WORKBOOK — the data layer.
   Numbers that are calculated live here as formulas, exactly as they would
   in a real model. The page above is a view onto it; every figure the site
   renders from these cells can show its own formula.
   ═══════════════════════════════════════════════════════════════════════ */

const SHEETS = [

/* Headline figures, as disclosed on the CV. */
{
  name:'Facts', rows:20, cols:[], cells:{
    C3:{v:50,   f:'num0'},          /* transaction size underwritten — low  ($M) */
    C4:{v:1200, f:'num0'},          /* transaction size underwritten — high ($M) */
    C5:{v:500,  f:'num0'},          /* feedstock agreements structured ($M) */
    C6:{v:800,  f:'num0'},          /* offtake agreements structured   ($M) */
    C7:{v:'=C5+C6', f:'num0'},      /* total agreements structured */
    C8:{v:5,    f:'num0'},          /* biopower developments directed */
    C9:{v:0.70, f:'pct0'},          /* capex reduction, relocation structure */
    C10:{v:1.40,f:'pct0'},          /* revenue uplift, relocation structure */
    C11:{v:3.0, f:'num1'},          /* feedstock & offtake rights (m tons) */
    C12:{v:1.0, f:'num1'},          /* venture capital raised ($M) */
    C13:{v:6000,f:'num0'},          /* commodity flows supported ($M) */
    C14:{v:'=C13/1000', f:'num0'},  /* the same, in $B, for display */
  }
},

/* Employment dates. Tenure accrues against TODAY() on every visit. */
{

/* ═══════════════════════════════════════════════════════════════════════
   2. FORMULA ENGINE
   Recursive-descent parser, no eval. Lazy evaluation with memoisation and
   circular-reference detection. Dates are Excel serials on the 1899-12-30
   epoch, so date arithmetic behaves as it does in a real workbook.
   ═══════════════════════════════════════════════════════════════════════ */

const SHEET_BY_NAME = Object.fromEntries(SHEETS.map(s => [s.name, s]));
const overrides = Object.create(null);
let cache = new Map();
const evalStack = new Set();

const EPOCH = Date.UTC(1899, 11, 30);
const serial = (y, m, d) => Math.round((Date.UTC(y, m - 1, d) - EPOCH) / 864e5);
const fromSerial = s => new Date(EPOCH + Math.round(s) * 864e5);
const todaySerial = () => { const n = new Date(); return serial(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
const colLetter = i => { let s = '', n = i + 1; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const colIndex = L => { let n = 0; for (const ch of L) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };

const RE_NUM = /^\d+(?:\.\d+)?/;
const RE_STR = /^"([^"]*)"/;
const RE_REF = /^(?:([A-Za-z][A-Za-z0-9_]*)!)?\$?([A-Z]{1,2})\$?(\d{1,4})(?![A-Za-z0-9_])/;
const RE_ID  = /^[A-Za-z][A-Za-z0-9_.]*/;
const RE_OP  = /^(<=|>=|<>|[+\-*/^&(),:<>=])/;

function tokenize(src) {
  const out = []; let s = src;
  while (s.length) {
    if (/^\s/.test(s)) { s = s.replace(/^\s+/, ''); continue; }
    let m;
    if ((m = RE_STR.exec(s))) { out.push({ t:'str', v:m[1] }); s = s.slice(m[0].length); continue; }
    if ((m = RE_NUM.exec(s))) { out.push({ t:'num', v:parseFloat(m[0]) }); s = s.slice(m[0].length); continue; }
    if ((m = RE_REF.exec(s))) { out.push({ t:'ref', sheet:m[1] || null, col:m[2], row:+m[3] }); s = s.slice(m[0].length); continue; }
    if ((m = RE_ID.exec(s)))  { out.push({ t:'id', v:m[0].toUpperCase() }); s = s.slice(m[0].length); continue; }
    if ((m = RE_OP.exec(s)))  { out.push({ t:'op', v:m[0] }); s = s.slice(m[0].length); continue; }
    throw new Error('#SYNTAX!');
  }
  return out;
}

const flat = a => a.flatMap(x => Array.isArray(x) ? x : [x]);
const nums = a => flat(a).filter(v => typeof v === 'number' && isFinite(v));

const FN = {
  SUM:a => nums(a).reduce((x, y) => x + y, 0),
  COUNT:a => nums(a).length,
  AVERAGE:a => { const n = nums(a); return n.length ? n.reduce((x, y) => x + y, 0) / n.length : 0; },
  MAX:a => { const n = nums(a); return n.length ? Math.max(...n) : 0; },
  MIN:a => { const n = nums(a); return n.length ? Math.min(...n) : 0; },
  ABS:a => Math.abs(+a[0]),
  ROUND:a => { const p = Math.pow(10, a[1] === undefined ? 0 : +a[1]); return Math.round(+a[0] * p) / p; },
  IF:a => (a[0] ? a[1] : a[2] !== undefined ? a[2] : false),
  REPT:a => String(a[0]).repeat(Math.max(0, Math.min(200, Math.round(+a[1] || 0)))),
  TODAY:() => todaySerial(),
  DATE:a => serial(+a[0], +a[1], +a[2]),
  YEAR:a => fromSerial(+a[0]).getUTCFullYear(),
  MONTH:a => fromSerial(+a[0]).getUTCMonth() + 1,
  YEARFRAC:a => (+a[1] - +a[0]) / 365.25,
  SUMPRODUCT:a => {
    const arrs = a.map(x => Array.isArray(x) ? x : [x]);
    const len = Math.min(...arrs.map(x => x.length));
    let t = 0;
    for (let i = 0; i < len; i++) t += arrs.reduce((p, x) => p * (typeof x[i] === 'number' ? x[i] : 0), 1);
    return t;
  },
  COUNTIF:a => {
    const range = Array.isArray(a[0]) ? a[0] : [a[0]];
    const crit = String(a[1]).toLowerCase();
    return range.filter(v => String(v).toLowerCase() === crit).length;
  },
  PMT:a => {
    const r = +a[0], n = +a[1], pv = +a[2];
    if (!isFinite(r) || !isFinite(n) || n <= 0) return NaN;
    return r === 0 ? pv / n : pv * r / (1 - Math.pow(1 + r, -n));
  },
  NPV:a => { const r = +a[0]; return nums(a.slice(1)).reduce((s, c, i) => s + c / Math.pow(1 + r, i + 1), 0); },
  IRR:a => {
    const cf = nums(a);
    if (cf.length < 2) return NaN;
    const npv = r => cf.reduce((s, c, i) => s + c / Math.pow(1 + r, i), 0);
    let lo = -0.9999, hi = 10, flo = npv(lo), fhi = npv(hi);
    if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return NaN;
    for (let i = 0; i < 200; i++) {
      const mid = (lo + hi) / 2, f = npv(mid);
      if (f === 0) return mid;
      if (flo * f < 0) { hi = mid; fhi = f; } else { lo = mid; flo = f; }
    }
    return (lo + hi) / 2;
  },
};

function evaluate(src, ctxSheet) {
  const tk = tokenize(src);
  let p = 0;
  const peek = () => tk[p];
  const isOp = v => peek() && peek().t === 'op' && peek().v === v;
  const eat = v => { if (!isOp(v)) throw new Error('#SYNTAX!'); p++; };

  function primary() {
    const t = peek();
    if (!t) throw new Error('#SYNTAX!');
    if (t.t === 'num' || t.t === 'str') { p++; return t.v; }
    if (t.t === 'op' && t.v === '(') { p++; const v = expr(); eat(')'); return v; }
    if (t.t === 'op' && t.v === '-') { p++; return -primary(); }
    if (t.t === 'op' && t.v === '+') { p++; return primary(); }
    if (t.t === 'ref') {
      p++;
      if (isOp(':') && tk[p + 1] && tk[p + 1].t === 'ref') { p++; const b = tk[p++]; return readRange(t, b, ctxSheet); }
      return readCell(t.sheet || ctxSheet, t.col + t.row);
    }
    if (t.t === 'id') {
      p++;
      const name = t.v;
      if (!isOp('(')) throw new Error('#NAME?');
      eat('(');
      const args = [];
      if (!isOp(')')) { args.push(expr()); while (isOp(',')) { p++; args.push(expr()); } }
      eat(')');
      const fn = FN[name];
      if (!fn) throw new Error('#NAME?');
      return fn(args);
    }
    throw new Error('#SYNTAX!');
  }
  function power(){ let v = primary(); while (isOp('^')) { p++; v = Math.pow(v, primary()); } return v; }
  function term(){ let v = power(); while (isOp('*') || isOp('/')) { const o = peek().v; p++; const r = power(); v = o === '*' ? v * r : (r === 0 ? NaN : v / r); } return v; }
  function add(){ let v = term(); while (isOp('+') || isOp('-')) { const o = peek().v; p++; const r = term(); v = o === '+' ? v + r : v - r; } return v; }
  function concat(){ let v = add(); while (isOp('&')) { p++; v = fmtConcat(v) + fmtConcat(add()); } return v; }
  function expr() {
    let v = concat();
    while (peek() && peek().t === 'op' && ['<','>','=','<=','>=','<>'].includes(peek().v)) {
      const o = peek().v; p++; const r = concat();
      v = o === '<' ? v < r : o === '>' ? v > r : o === '=' ? v === r
        : o === '<=' ? v <= r : o === '>=' ? v >= r : v !== r;
    }
    return v;
  }
  const result = expr();
  if (p !== tk.length) throw new Error('#SYNTAX!');
  return result;
}

const fmtConcat = v => typeof v === 'number' ? group(v, Math.abs(v % 1) > 1e-9 ? 1 : 0) : String(v);

function readRange(a, b, ctxSheet) {
  const sheet = a.sheet || ctxSheet;
  const c1 = colIndex(a.col), c2 = colIndex(b.col), r1 = a.row, r2 = b.row;
  const out = [];
  for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++)
    for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++)
      out.push(readCell(sheet, colLetter(c) + r));
  return out;
}

function rawOf(sheetName, ref) {
  const key = sheetName + '!' + ref;
  if (key in overrides) return overrides[key];
  const sh = SHEET_BY_NAME[sheetName];
  if (!sh) return '';
  const cell = sh.cells[ref];
  return cell ? cell.v : '';
}

function readCell(sheetName, ref) {
  const key = sheetName + '!' + ref;
  if (cache.has(key)) return cache.get(key);
  if (evalStack.has(key)) throw new Error('#CIRC!');
  const raw = rawOf(sheetName, ref);
  let val;
  if (raw === '' || raw === null || raw === undefined) val = 0;
  else if (typeof raw === 'number') val = raw;
  else if (typeof raw === 'string' && raw[0] === '=') {
    evalStack.add(key);
    try { val = evaluate(raw.slice(1), sheetName); }
    catch (e) { val = (e && /^#/.test(e.message)) ? e.message : '#ERROR!'; }
    finally { evalStack.delete(key); }
  } else val = raw;
  cache.set(key, val);
  return val;
}

/* ---- formatting ---- */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function group(v, dec) {
  const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec });
  const neg = v < 0 && parseFloat(s.replace(/,/g, '')) !== 0;
  return neg ? '(' + s + ')' : s;
}
function formatValue(v, f) {
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (typeof v === 'string') return v;
  if (v === null || v === undefined) return '';
  if (typeof v !== 'number' || !isFinite(v)) return '—';
  switch (f) {
    case 'num0': return group(v, 0);
    case 'num1': return group(v, 1);
    case 'num2': return group(v, 2);
    case 'num3': return group(v, 3);
    case 'x2':   return group(v, 2) + 'x';
    case 'pct0': return group(v * 100, 0) + '%';
    case 'pct1': return group(v * 100, 1) + '%';
    case 'usd':  return '$' + group(v, 0);
    case 'date': { const d = fromSerial(v); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
    case 'mmmyy':{ const d = fromSerial(v); return MONTHS[d.getUTCMonth()] + ' ’' + String(d.getUTCFullYear()).slice(2); }
    default:     return group(v, Math.abs(v % 1) > 1e-9 ? 1 : 0);
  }
}

const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* A figure wired to the workbook. It knows its own cell, so it can show its formula. */
function cell(sheet, ref, opts = {}) {
  const e = $(opts.tag || 'span', (opts.cls || '') + ' ' + (opts.kind || 'calc'));
  e.dataset.cell = sheet + '!' + ref;
  if (opts.f) e.dataset.f = opts.f;
  e.tabIndex = 0;
  return e;
}

function paintCells(root = document) {
  root.querySelectorAll('[data-cell]').forEach(e => {
    const [sheet, ref] = e.dataset.cell.split('!');
    const v = readCell(sheet, ref);
    e.textContent = formatValue(v, e.dataset.f || (SHEET_BY_NAME[sheet].cells[ref] || {}).f);
  });
}

/* the formula bar */
function showFormula(sheet, ref) {
  const raw = rawOf(sheet, ref);
  fref.textContent = sheet + '!' + ref;
  const isF = typeof raw === 'string' && raw[0] === '=';
  ftext.textContent = isF ? raw : String(raw);
  ftext.classList.toggle('live', isF);
}
const HINT = matchMedia('(hover: none)').matches
  ? 'Tap any calculated figure for its formula'
  : 'Hover any calculated figure to read the formula behind it';
function clearFormula() {
  fref.textContent = '—';
  ftext.textContent = HINT;
  ftext.classList.remove('live');
}
document.addEventListener('pointerover', e => {
  const t = e.target.closest('[data-cell]');
  if (t) { const [s, r] = t.dataset.cell.split('!'); showFormula(s, r); }
});
document.addEventListener('focusin', e => {
  const t = e.target.closest && e.target.closest('[data-cell]');
  if (t) { const [s, r] = t.dataset.cell.split('!'); showFormula(s, r); }
});
document.addEventListener('pointerout', e => {
  if (e.target.closest && e.target.closest('[data-cell]') && !e.relatedTarget?.closest?.('[data-cell]')) clearFormula();
});
document.addEventListener('click', e => {
  if (!e.target.closest('[data-cell]')) clearFormula();
});

/* Run the model under a temporary set of inputs, then put everything back.
   This is what lets the stress tests, the breakeven solve and the sensitivity
   grid each be real model runs rather than a second, simplified formula. */
function underScenario(temp, read) {
  const savedOv = Object.assign(Object.create(null), overrides);
  const savedCache = cache;
  Object.assign(overrides, temp);
  cache = new Map();
  try { return read(); }
  finally {
    for (const k in overrides) delete overrides[k];
    Object.assign(overrides, savedOv);
    cache = savedCache;
  }
}

/* the PPA price at which equity NPV is zero */
function breakeven(extra) {
  const f = p => underScenario(Object.assign({}, extra, { 'Assumptions!C13':p }), () => val('Model', 'C49'));
  /* note: the breakeven re-sizes debt, since a different price is a different deal */
  let lo = 5, hi = 500, flo = f(lo), fhi = f(hi);
  if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return NaN;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2, fm = f(mid);
    if (!isFinite(fm)) break;
    if (flo * fm <= 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
}

const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (t, attrs) => { const e = document.createElementNS(SVGNS, t); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

/* round axis steps — 18/14/9/5/0 reads as an accident, 20/15/10/5/0 reads as a scale */
function niceScale(max, count) {
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top + step * 1e-9; v += step) ticks.push(v);
  return { top, ticks, step };
}

function drawCashflow() {
  const host = document.getElementById('cashflow');
  host.textContent = '';
  const W = 760, H = 236, ml = 42, mr = 8, mt = 14, mb = 26;
  const iw = W - ml - mr, ih = H - mt - mb;

  const data = YCOLS.map((c, i) => ({
    year:i + 1,
    ebitda:val('Model', c + '15'),
    ds:Math.abs(val('Model', c + '16')),
    dscr:val('Model', c + '21'),
  }));
  const peak = Math.max(...data.map(d => Math.max(d.ebitda, d.ds)), 1);
  const { top, ticks, step } = niceScale(peak * 1.08, 4);
  const y = v => mt + ih - (v / top) * ih;

  const svg = svgEl('svg', { class:'chart', viewBox:'0 0 ' + W + ' ' + H, role:'img',
    'aria-label':'EBITDA against debt service over twenty years. Year one EBITDA ' +
      formatValue(data[0].ebitda, 'num1') + ' million dollars against debt service ' +
      formatValue(data[0].ds, 'num1') + ' million, a cover ratio of ' + formatValue(data[0].dscr, 'x2') + '.' });

  const dp = step < 1 ? 2 : (Math.abs(step % 1) > 1e-9 ? 1 : 0);
  ticks.forEach(v => {
    const yy = y(v);
    svg.appendChild(svgEl('line', { class:'gridline', x1:ml, x2:W - mr, y1:yy, y2:yy }));
    const t = svgEl('text', { class:'tick ytick', x:ml - 7, y:yy + 3.5, 'text-anchor':'end' });
    t.textContent = v.toFixed(dp);
    svg.appendChild(t);
  });
  svg.appendChild(svgEl('line', { class:'axis', x1:ml, x2:W - mr, y1:y(0), y2:y(0) }));

  const band = iw / data.length;
  const bw = Math.max(5, Math.min(11, band / 2 - 2)), gap = 2;
  data.forEach((d, i) => {
    const cx = ml + band * i + band / 2;
    const pairs = [[cx - bw - gap / 2, d.ebitda, 'var(--series-1)']];
    if (d.ds > 0) pairs.push([cx + gap / 2, d.ds, 'var(--series-2)']);
    pairs.forEach(([x, v, fill]) => {
      const h = Math.max(1, y(0) - y(v));
      const r = svgEl('rect', { x, y:y(v), width:bw, height:h, fill, rx:4, ry:4 });
      /* square off the baseline end: rounding belongs to the data end only */
      const cover = svgEl('rect', { x, y:y(0) - Math.min(4, h), width:bw, height:Math.min(4, h), fill });
      const enter = ev => showTip(
        '<b>Year ' + d.year + '</b>EBITDA <i>' + formatValue(d.ebitda, 'num1') + '</i>' +
        (d.ds > 0 ? ' · Debt service <i>' + formatValue(d.ds, 'num1') + '</i><br>DSCR <i>' + formatValue(d.dscr, 'x2') + '</i>'
                  : '<br><i>debt repaid</i>'),
        ev.clientX, ev.clientY);
      [r, cover].forEach(el => {
        el.addEventListener('pointerenter', enter);
        el.addEventListener('pointermove', enter);
        el.addEventListener('pointerleave', hideTip);
      });
      svg.append(r, cover);
    });
    if (d.year === 1 || d.year % 5 === 0) {
      const lbl = svgEl('text', { class:'tick', x:cx, y:H - 9, 'text-anchor':'middle' });
      lbl.textContent = d.year;
      svg.appendChild(lbl);
    }
  });

  /* selective direct labels: first and last EBITDA only */
  [[0, data[0]], [data.length - 1, data[data.length - 1]]].forEach(([i, d]) => {
    const cx = ml + band * i + band / 2 - bw / 2 - 1;
    const t = svgEl('text', { class:'tick', x:cx, y:y(d.ebitda) - 6, 'text-anchor':'middle' });
    t.setAttribute('fill', 'var(--ink-2)');
    t.setAttribute('font-weight', '700');
    t.textContent = formatValue(d.ebitda, 'num1');
    svg.appendChild(t);
  });
  host.appendChild(svg);
}

/* diverging ramp, blue ↔ red with a neutral grey midpoint at NPV = 0 */
const RAMP_NEG = ['#f6c9c7', '#e07470', '#a93230'];
const RAMP_POS = ['#b7d3f6', '#5598e7', '#1c5cab'];
const MID = '#f0efec';
function heatColor(v, scale) {
  if (!isFinite(v)) return { c:MID, dark:false };
  const t = Math.min(1, Math.abs(v) / scale);
  if (t < 0.06) return { c:MID, dark:false };
  const arm = v < 0 ? RAMP_NEG : RAMP_POS;
  const i = t < 0.4 ? 0 : t < 0.75 ? 1 : 2;
  return { c:arm[i], dark:i === 2 };
}

  const grid = rows.map(p => cols.map(cx =>
    underScenario({ 'Assumptions!C13':p, 'Assumptions!C22':cx }, () => val('Model', 'C49'))));
  const scale = Math.max(...grid.flat().map(Math.abs), 1);

  const t = $('table', 'heat');
  t.appendChild($('caption', 'sr', 'Equity NPV in millions of dollars by PPA price and capex per kW'));

  cols.forEach(c => htr.appendChild($('th', null, '$' + formatValue(c, 'num0'))));
  thead.appendChild(htr); t.appendChild(thead);
  const tb = $('tbody');
  rows.forEach((p, r) => {
    const tr = $('tr');
    tr.appendChild($('th', null, '$' + formatValue(p, 'num0')));

      const v = grid[r][ci];
      const td = $('td', (r === 2 && ci === 2) ? 'base' : null, formatValue(v, 'num0'));

      const enter = ev => showTip(
        '<b>Equity NPV ' + formatValue(v, 'num1') + ' $M</b>PPA <i>$' + formatValue(p, 'num0') +
        '/MWh</i> · Capex <i>$' + formatValue(cx, 'num0') + '/kW</i>',
        ev.clientX, ev.clientY);
      td.addEventListener('pointerenter', enter);
      td.addEventListener('pointermove', enter);
      td.addEventListener('pointerleave', hideTip);
      tr.appendChild(td);
    });
    tb.appendChild(tr);

  t.appendChild(tb);
  host.appendChild(t);

  STRESSES.forEach(([name, f]) => rows.push([name, underScenario(Object.assign({}, f(), pin), RESULT), false]));
  rows.push(['All stresses stacked', underScenario(Object.assign({}, stackAll(), pin), RESULT), true]);

  const t = $('table', 'sched stress');
  const thead = $('thead'), htr = $('tr');
  ['Case', 'Equity NPV', 'Δ NPV', 'Equity IRR', 'Min DSCR'].forEach((h, i) =>
    htr.appendChild($('th', i ? 'n' : null, h)));

    const tr = $('tr');

    tr.appendChild($('td', 'n muted', name === 'Base case' ? '—' : (d >= 0 ? '+' : '') + formatValue(d, 'num1')));
    tr.appendChild($('td', 'n', isFinite(r.irr) ? formatValue(r.irr, 'pct1') : '—'));
    const ds = $('td', 'n', r.dscr >= 900 ? '—' : formatValue(r.dscr, 'x2'));
    if (r.dscr < 1) ds.classList.add('bad');
    tr.appendChild(ds);
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  host.appendChild(t);
}

   6. RECALC
   Headline figures update on every slider tick. The stress table, the
   sensitivity grid and the breakeven solve are debounced, since each of
   those is dozens of complete model evaluations.
   ═══════════════════════════════════════════════════════════════════════ */

let heavyTimer;

function recalc() {
  cache = new Map();
  paintCells();

  document.querySelectorAll('[data-out]').forEach(o => {
    const [s, r] = o.dataset.out.split('!');
    o.textContent = txt(s, r);
    if (o.dataset.unit) o.appendChild($('span', 'u', o.dataset.unit));
  });
  const ao = document.getElementById('alpha-out');
  if (ao) ao.textContent = '$' + txt('Research', 'C10') + ' /MWh/GW';

  const maxT = Math.max(...SITE.jobs.map(j => val('Career', 'F' + j.row)));
  document.querySelectorAll('[data-tbar]').forEach(b => {
    b.style.width = (val('Career', 'F' + b.dataset.tbar) / maxT * 100).toFixed(1) + '%';
  });

  const npvTile = document.querySelector('[data-tile="C49"]');
  if (npvTile) npvTile.classList.toggle('neg', val('Model', 'C49') < 0);

  const lev = document.getElementById('leverage');
  if (lev) lev.textContent = formatValue(val('Model', 'C43') / val('Model', 'C41'), 'pct0');

  const badge = document.getElementById('tie');
  if (badge) {
    const ok = val('Model', 'C55') === 'OK';
    badge.textContent = ok ? '✓ all three pass' : '✗ CHECK';
    badge.classList.toggle('bad', !ok);
  }

  drawCashflow();

  clearTimeout(heavyTimer);
  heavyTimer = setTimeout(heavy, 130);
}

function heavy() {
  const be = document.getElementById('breakeven');
  if (be) {
    const b0 = breakeven({}), b1 = breakeven(stackAll());
    be.textContent = '$' + (isFinite(b0) ? formatValue(b0, 'num0') : '—');
    const s = $('span');
    s.style.cssText = 'font-size:12px;color:var(--ink-3);margin-left:7px';
    s.textContent = isFinite(b1) ? '· $' + formatValue(b1, 'num0') + ' stacked' : '';
    be.appendChild(s);
  }
  drawStress();
  drawHeat();
}

syncControls();
recalc();
clearFormula();
recalc();
clearFormula();
</script>
</body>
</html>

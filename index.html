   5. CHARTS
   Palette validated with the data-viz validator against a white surface:
   #2a78d6 / #eb6834 — CVD ΔE 24.7, normal-vision ΔE 33.6, both above floor.
   The page commits to one theme, so the charts do too.
   ═══════════════════════════════════════════════════════════════════════ */

/* round axis steps — 18/14/9/5/0 reads as an accident, 20/15/10/5/0 reads as a scale */
function niceScale(max, count) {
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top + step * 1e-9; v += step) ticks.push(v);
  return { top, ticks, step };
}

function drawCashflow() {
  const host = document.getElementById('cashflow');
  host.textContent = '';
  const W = 760, H = 236, ml = 42, mr = 8, mt = 14, mb = 26;
  const iw = W - ml - mr, ih = H - mt - mb;

  const data = YCOLS.map((c, i) => ({
    year:i + 1,
    ebitda:val('Model', c + '15'),
    ds:Math.abs(val('Model', c + '19')),
    dscr:val('Model', c + '24'),
  }));
  const peak = Math.max(...data.map(d => Math.max(d.ebitda, d.ds)), 1);
  const { top, ticks, step } = niceScale(peak * 1.08, 4);
  const y = v => mt + ih - (v / top) * ih;

  const svg = svgEl('svg', { class:'chart', viewBox:'0 0 ' + W + ' ' + H, role:'img',
    'aria-label':'EBITDA against debt service over twenty years. Year one EBITDA ' +
      formatValue(data[0].ebitda, 'num1') + ' million dollars against debt service ' +
      formatValue(data[0].ds, 'num1') + ' million, a cover ratio of ' + formatValue(data[0].dscr, 'x2') + '.' });

  const dp = step < 1 ? 2 : (Math.abs(step % 1) > 1e-9 ? 1 : 0);
  ticks.forEach(v => {
    const yy = y(v);
    svg.appendChild(svgEl('line', { class:'gridline', x1:ml, x2:W - mr, y1:yy, y2:yy }));
    const t = svgEl('text', { class:'tick ytick', x:ml - 7, y:yy + 3.5, 'text-anchor':'end' });
    t.textContent = v.toFixed(dp);
    svg.appendChild(t);
  });
  svg.appendChild(svgEl('line', { class:'axis', x1:ml, x2:W - mr, y1:y(0), y2:y(0) }));

  const band = iw / data.length;
  const bw = Math.max(5, Math.min(11, band / 2 - 2)), gap = 2;
  data.forEach((d, i) => {
    const cx = ml + band * i + band / 2;
    const pairs = [[cx - bw - gap / 2, d.ebitda, 'var(--series-1)']];
    if (d.ds > 0) pairs.push([cx + gap / 2, d.ds, 'var(--series-2)']);
    pairs.forEach(([x, v, fill]) => {
      const h = Math.max(1, y(0) - y(v));
      const r = svgEl('rect', { x, y:y(v), width:bw, height:h, fill, rx:4, ry:4 });
      /* square off the baseline end: rounding belongs to the data end only */
      const cover = svgEl('rect', { x, y:y(0) - Math.min(4, h), width:bw, height:Math.min(4, h), fill });
      const enter = ev => showTip(
        '<b>Year ' + d.year + '</b>EBITDA <i>' + formatValue(d.ebitda, 'num1') + '</i>' +
        (d.ds > 0 ? ' · Debt service <i>' + formatValue(d.ds, 'num1') + '</i><br>DSCR <i>' + formatValue(d.dscr, 'x2') + '</i>'
                  : '<br><i>debt repaid</i>'),
        ev.clientX, ev.clientY);
      [r, cover].forEach(el => {
        el.addEventListener('pointerenter', enter);
        el.addEventListener('pointermove', enter);
        el.addEventListener('pointerleave', hideTip);
      });
      svg.append(r, cover);
    });
    if (d.year === 1 || d.year % 5 === 0) {
      const lbl = svgEl('text', { class:'tick', x:cx, y:H - 9, 'text-anchor':'middle' });
      lbl.textContent = d.year;
      svg.appendChild(lbl);
    }
  });

  /* selective direct labels: first and last EBITDA only */
  [[0, data[0]], [data.length - 1, data[data.length - 1]]].forEach(([i, d]) => {
    const cx = ml + band * i + band / 2 - bw / 2 - 1;
    const t = svgEl('text', { class:'tick', x:cx, y:y(d.ebitda) - 6, 'text-anchor':'middle' });
    t.setAttribute('fill', 'var(--ink-2)');
    t.setAttribute('font-weight', '700');
    t.textContent = formatValue(d.ebitda, 'num1');
    svg.appendChild(t);
  });
  host.appendChild(svg);
}

/* diverging ramp, blue ↔ red with a neutral grey midpoint at NPV = 0 */
const RAMP_NEG = ['#f6c9c7', '#e07470', '#a93230'];
const RAMP_POS = ['#b7d3f6', '#5598e7', '#1c5cab'];
const MID = '#f0efec';
/* ── ranked sensitivity ──────────────────────────────────────────────
   A tornado laid out as a schedule. Every bar is a complete model run
   through underScenario(), not a derivative, so a clamped input or an
   unfinanceable corner shows up as itself instead of as a smooth line. */
/* The third field is the unit to print beside the value. The cells carry a
   `u` of their own, but it is a slider hint as often as a unit — "sizes the
   debt", "\u00a76418 transfer" — so the ones that are really units are named
   here.

   The fourth converts the cell's own value into the figure to show, for the
   dials whose stored unit is not the one worth reading. Capex used to need it,
   back when it was dialled per kW; it is dialled in millions now. */
const DRIVERS = [
  ['PPA price, year 1',         'C13', '$/MWh'],
  ['Availability, steady state','C11', ''],
  ['Capex',                     'C22', '$M'],
  ['Fuel contract ceiling',     'C17', '$/ton'],
  ['Non-fuel opex, year 1',     'C19', '$M'],
  ['Interest rate',             'C25', ''],
  ['PPA escalator',             'C14', ''],
  ['Target minimum DSCR',       'C24', ''],
  ['Contingency',               'C23', ''],
  ['Credit monetization',       'C34', ''],
];

function drawTornado() {
  const host = document.getElementById('tornado');
  if (!host) return;
  host.textContent = '';
  const base = val('Model', 'C55');
  if (!isFinite(base)) { host.appendChild($('p', 'none', 'Not financeable at these inputs, so there is nothing to rank.')); return; }

  const rows = DRIVERS.map(([lbl, ref]) => {
    const d = SHEET_BY_NAME['Assumptions'].cells[ref];
    const v0 = val('Assumptions', ref);
    /* clamp to the slider's own band: a 10% move on 91% availability is not
       100% availability, and pretending otherwise overstates the driver */
    const lo = Math.max(d.min, v0 * 0.9), hi = Math.min(d.max, v0 * 1.1);
    const f = x => underScenario({ ['Assumptions!' + ref]:x }, () => val('Model', 'C55'));
    const nlo = f(lo), nhi = f(hi);
    const dlo = isFinite(nlo) ? nlo - base : NaN;
    const dhi = isFinite(nhi) ? nhi - base : NaN;
    const swing = Math.max(isFinite(dlo) ? Math.abs(dlo) : 0, isFinite(dhi) ? Math.abs(dhi) : 0);
    return { lbl, ref, dlo, dhi, swing, clamped:(lo > v0 * 0.9 + 1e-12 || hi < v0 * 1.1 - 1e-12) };
  }).filter(r => r.swing > 0).sort((a, b) => b.swing - a.swing);

  if (!rows.length) { host.appendChild($('p', 'none', 'Nothing moves the answer at these inputs.')); return; }

  /* the axis runs symmetrically about the base case, on round steps, with
     enough headroom that the longest bar does not touch the end */
  const { top, step } = niceScale(rows[0].swing * 1.12, 2);
  const max = top;
  const dp = step < 1 ? 2 : (Math.abs(step % 1) > 1e-9 ? 1 : 0);
  const pos = d => 50 + (d / max) * 50;      /* $M change -> % across the track */

  const t = $('table', 'torn');
  const thead = $('thead'), htr = $('tr');
  htr.appendChild($('th', null, 'Assumption'));

  /* the axis lives in the header, so every bar below is read against it */
  const ax = $('th', 'c');
  const axw = $('div', 'tax');
  const dirs = $('div', 'taxdir');
  dirs.append($('span', 'w', 'worse'), $('span', null, 'Equity NPV, $M'), $('span', 'b', 'better'));
  axw.appendChild(dirs);
  const scale = $('div', 'taxs');
  const vals = [];
  for (let v = -top; v <= top + step * 1e-9; v += step) vals.push(v);
  vals.forEach((v, i) => {
    /* the ends align inward so they do not hang outside the cell, and the
       intermediate ticks are the ones a phone drops */
    const cls = v === 0 ? 'zero' : i === 0 ? 'edge l' : i === vals.length - 1 ? 'edge r' : 'mid';
    const k = $('span', cls);
    k.style.left = pos(v) + '%';
    k.textContent = v === 0 ? formatValue(base, 'num1') : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(dp);
    scale.appendChild(k);
  });
  axw.appendChild(scale);
  ax.appendChild(axw);
  htr.appendChild(ax);

  thead.appendChild(htr); t.appendChild(thead);

  const tb = $('tbody');
  rows.forEach(r => {
    const tr = $('tr');
    const l = $('td', 'lbl', r.lbl + (r.clamped ? ' · clamped' : ''));
    tr.appendChild(l);

    const bc = $('td', 'bar');
    const tbar = $('div', 'tb');
    [['lo', r.dlo], ['hi', r.dhi]].forEach(([side, d]) => {
      if (!isFinite(d) || d === 0) return;
      const wpc = Math.abs(d) / max * 50;
      /* red where equity NPV falls, green where it rises. Which side of the
         base case it lands on says the same thing again, so neither reading
         carries it alone. */
      const i = $('i', d >= 0 ? 'up' : 'dn');
      i.style.left = (d >= 0 ? 50 : 50 - wpc) + '%';
      i.style.width = wpc + '%';
      /* the exact figures used to be two columns beside the bar, which said
         them twice once the axis could be read. They live on the bar now. */
      i.dataset.side = side;
      i.dataset.d = d.toFixed(4);
      i.tabIndex = 0;
      const word = side === 'lo' ? 'If 10% low' : 'If 10% high';
      i.setAttribute('aria-label', r.lbl + '. ' + word + ', equity NPV ' +
        formatValue(base + d, 'num1') + ' million, ' + (d >= 0 ? 'up ' : 'down ') +
        formatValue(Math.abs(d), 'num1') + ' million.');
      const at = ev => {
        const b = i.getBoundingClientRect();
        showTip('<b>' + esc(r.lbl) + '</b>' + word + ' · equity NPV <i>' +
          formatValue(base + d, 'num1') + '</i><br>' + (d >= 0 ? 'up' : 'down') +
          ' <i>' + formatValue(Math.abs(d), 'num1') + '</i> from base',
          ev.clientX || b.left + b.width / 2, ev.clientY || b.top);
      };
      i.addEventListener('pointerenter', at);
      i.addEventListener('pointermove', at);
      i.addEventListener('pointerleave', hideTip);
      i.addEventListener('focus', at);
      i.addEventListener('blur', hideTip);
      tbar.appendChild(i);
    });
    tbar.appendChild($('u'));
    bc.appendChild(tbar);
    tr.appendChild(bc);
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  t.setAttribute('aria-label', 'Each assumption taken ten percent either way, ranked by how far ' +
    'equity NPV moves from its base of ' + formatValue(base, 'num1') + ' million dollars. ' +
    rows[0].lbl + ' moves it furthest.');
  host.appendChild(t);
}

/* What a buyer who needs firm power is actually choosing between. Capital cost
   is the second question; the first is when the electrons arrive, and on that
   axis a relocated plant is not competing with new biomass, it is competing
   with a turbine slot and an interconnection queue. */
const ALTERNATIVES = [
  ['New biomass plant', 'C61', 'alt', [36, 48]],
  ['New gas, incl. turbine slot', null, 'alt', [48, 72]],
  ['New nuclear', null, 'alt', [120, 180]],
];

function drawTimeline() {
  const host = document.getElementById('timeline');
  if (!host) return;
  host.textContent = '';
  const own = val('Assumptions', 'C62');
  if (!isFinite(own) || own <= 0) return;

  const rows = [['Relocate this plant', own, 'own', null]];
  ALTERNATIVES.forEach(([lbl, ref, cls, band]) => {
    const v = ref ? val('Assumptions', ref) : (band[0] + band[1]) / 2;   /* the dial wins */
    rows.push([lbl, v, cls, band]);
  });
  const max = Math.max(...rows.map(r => r[1]));

  host.appendChild($('h4', null, 'Months to first power'));
  host.appendChild($('p', 'cap', "What someone short of firm power is actually choosing between. The relocation schedule adds up the stages below it. The other three are roughly what those options take today."));
  const wrap = $('div', 'cbars');
  rows.forEach(([lbl, v, cls, band]) => {
    const r = $('div', 'cbar');
    r.appendChild($('span', 'l', lbl));
    const track = $('div', 'tk');
    const fill = $('i', cls);
    fill.style.width = (v / max * 100) + '%';
    track.appendChild(fill);
    r.appendChild(track);
    r.appendChild($('span', 'v', formatValue(v, 'num0') + ' mo'));
    r.appendChild($('span', 'p', band ? band[0] + '\u2013' + band[1] : 'this model'));
    wrap.appendChild(r);
  });
  host.appendChild(wrap);
  /* written, not cell()d: paintCells runs before heavy(), so a cell created
     here would never be filled in */
  const fn = $('p', 'cap');
  fn.style.margin = '9px 0 0';
  fn.textContent = 'First power is unit one. Full commercial operation follows '
    + formatValue(val('Assumptions', 'C59'), 'num0') + ' months later, at '
    + formatValue(val('Assumptions', 'C63'), 'num0') + ' months from the start.';
  host.appendChild(fn);
  host.setAttribute('aria-label', 'Months to first power: ' +
    rows.map(r => r[0] + ' ' + formatValue(r[1], 'num0')).join(', ') + '.');
}

/* the same two capital costs as a picture, because a four-times gap read down
   a column is a fact and seen side by side is an argument */
function drawTradeBars(brown, green, netkW) {

  host.appendChild($('h4', null, 'Capital cost, all in'));

/* Brownfield against greenfield, every cell a model run rather than a claim */
function drawTrade() {
  const host = document.getElementById('trade');
  if (!host) return;
  host.textContent = '';
  const { brown, green } = TRADE();

  const thead = $('thead'), htr = $('tr');
  htr.appendChild($('th', null, ''));
  htr.appendChild($('th', 'n', 'Relocate'));
  htr.appendChild($('th', 'n', 'Build new'));
  htr.appendChild($('th', 'n', 'Difference'));
  thead.appendChild(htr); host.appendChild(thead);

  const num = (v, f, pre, suf) => !isFinite(v) ? 'n.m.'
    : (pre || '') + formatValue(v, f) + (suf || '');
  const tb = $('tbody');
  [['Months to first power', 'months', 'num0', '', ' mo', true],
   ['Capital cost, all in', 'capex', 'num1', '$', 'M', true],
   ['Funding requirement',  'funding', 'num1', '$', 'M', true],
   ['DSCR',                 'dscr', 'x2', '', '', false],
   ['Project IRR',          'proj', 'pct1', '', '', false],
   ['Equity NPV',           'npv', 'num1', '$', 'M', false],
  ].forEach(([lbl, k, f, pre, suf, lowerIsBetter]) => {
    const tr2 = $('tr');
    const lc = $('td');
    const dfn = $('span', 'def', lbl);
    if (DEF[lbl]) { dfn.dataset.def = lbl; dfn.tabIndex = 0;
                    dfn.setAttribute('aria-label', lbl + '. ' + DEF[lbl]); }
    lc.appendChild(dfn);
    tr2.appendChild(lc);
    tr2.appendChild($('td', 'n', num(brown[k], f, pre, suf)));
    tr2.appendChild($('td', 'n muted', num(green[k], f, pre, suf)));
    const d = brown[k] - green[k];
    /* null means the row has no better direction: more debt is not a win */
    const good = lowerIsBetter === null ? null : lowerIsBetter ? d < 0 : d > 0;
    const dc = $('td', 'n ' + (good !== null && isFinite(d) && d !== 0
      ? (good ? 'good' : 'bad') : 'muted'));
    /* a difference of two percentages is points, not percent */
    dc.textContent = !isFinite(d) ? '\u2014'
      : (d >= 0 ? '+' : '\u2212') + (f.startsWith('pct')
          ? formatValue(Math.abs(d), f).replace('%', '') + ' pts'
          : num(Math.abs(d), f, pre, suf));

    'Relocating costs ' + formatValue(brown.capex, 'num1') + ' million against ' +

    formatValue(brown.proj, 'pct1') + ' against ' + formatValue(green.proj, 'pct1') + '.');
}

function drawStress() {
  const host = document.getElementById('stress');
  if (!host) return;
  host.textContent = '';
  const head = document.getElementById('breakeven');
  const base = NPV();

  if (!isFinite(base) || base <= 0) {
    if (head) head.textContent = 'Equity NPV is already at or below zero at these inputs, so there is no room to measure.';
    return;
  }

  const dirs = DRIVERS.map(([, ref]) => adverseDir(ref));
  const rows = DRIVERS.map(([lbl, ref, unit, show], i) => {
    const d = SHEET_BY_NAME['Assumptions'].cells[ref];
    return { lbl, ref, unit, f:show ? show.f : d.f, show, v0:val('Assumptions', ref),
             dir:dirs[i], r:driverBreakeven(ref, dirs[i], base) };
  });
  /* least room first: the top row is the assumption to be most sure of */
  rows.sort((a, b) => {
    const ra = a.r && a.r.at !== undefined ? Math.abs(a.r.pct) : Infinity;
    const rb = b.r && b.r.at !== undefined ? Math.abs(b.r.pct) : Infinity;
    return ra - rb;
  });

  const all = uniformBreakeven(dirs);
  const tight = rows.find(r => r.r && r.r.at !== undefined);

  if (head) {
    head.textContent = '';
    delete head.dataset.t;
    if (all && all.t !== undefined) head.dataset.t = all.t;
    if (all && all.t !== undefined) {
      head.append('Every assumption would have to be ');
      head.appendChild($('b', null, formatValue(all.t, 'pct1') + ' worse than planned'));
      head.append(', all at once, to take equity NPV to zero.');
    } else {
      head.append('No uniform move within these ranges takes equity NPV to zero.');
    }
    if (tight) {
      head.append(' On its own, the tightest is ');
      head.appendChild($('b', null, tight.lbl.replace(/,.*$/, '')));
      head.append(', with ' + formatValue(Math.abs(tight.r.pct), 'pct1') + ' of room.');
    }
  }

  const t = $('table', 'sched stress');
  const thead = $('thead'), htr = $('tr');
  [['Assumption', ''], ['Planned', 'n'], ['Zero at', 'n'], ['Move', 'n']]
    .forEach(([h, c]) => htr.appendChild($('th', c, h)));
  thead.appendChild(htr); t.appendChild(thead);

  /* the unit is a property of the row, not of each figure in it: printing it
     in both value columns said it twice and cost the phone the width */
  const num = (v, r) => formatValue(r.show ? r.show.of(v) : v, r.f);
  const tb = $('tbody');
  rows.forEach(r => {
    const tr = $('tr');
    /* the solved figures, unrounded, so a check can put them back into the
       model and confirm they really do land on zero */
    tr.dataset.ref = r.ref;
    if (r.r && r.r.at !== undefined) { tr.dataset.at = r.r.at; tr.dataset.pct = r.r.pct; }
    else if (r.r && r.r.out) tr.dataset.survives = r.dir > 0 ? 'max' : 'min';
    const nm = $('td', null, r.lbl);
    if (r.unit) nm.append(' ', $('span', 'u', r.unit));
    tr.appendChild(nm);
    const p = $('td', 'n muted', num(r.v0, r));
    tr.appendChild(p);

    if (r.r && r.r.at !== undefined) {
      tr.appendChild($('td', 'n', num(r.r.at, r)));
      const m = $('td', 'n');
      m.textContent = (r.r.pct >= 0 ? '+' : '−') + formatValue(Math.abs(r.r.pct), 'pct1');
      /* under a tenth of its own value is not much room */
      if (Math.abs(r.r.pct) < 0.10) m.classList.add('bad');
      tr.appendChild(m);
    } else {
      const c = $('td', 'n muted wide2'); c.colSpan = 2;
      c.textContent = 'survives its whole range';
      tr.appendChild(c);
    }
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  t.setAttribute('aria-label', 'How far each assumption can move before equity NPV reaches zero, ' +
    'least room first.' + (tight ? ' ' + tight.lbl + ' has the least, at ' +
    formatValue(Math.abs(tight.r.pct), 'pct1') + '.' : ''));
  host.appendChild(t);
}

/* ═══════════════════════════════════════════════════════════════════════
   6. RECALC
   Headline figures update on every slider tick. The stress table, the
   sensitivity grid and the breakeven solve are debounced, since each of
   those is dozens of complete model evaluations.
   ═══════════════════════════════════════════════════════════════════════ */

let heavyTimer;

/* Some outputs are arithmetic rather than information at the edges of the input
   space, and printing them anyway is how a model tells a lie with a straight
   face. These say what is actually going on instead. */
function setDisplayOverrides() {
  const irrCell = document.querySelector('[data-cell="Model!C56"]');
  if (irrCell) {
    const irr = val('Model', 'C56'), eq = val('Model', 'C50'), fund = val('Model', 'C49');
    const thin = fund > 0 && eq / fund < 0.12;
    irrCell.dataset.override = (!isFinite(irr) || thin) ? 'n.m.' : irr > 1 ? 'over 100%' : '';
  }
  const dscrCell = document.querySelector('[data-cell="Model!C57"]');
  if (dscrCell) dscrCell.dataset.override = val('Model', 'C45') > 0 ? '' : 'no debt';
  const projCell = document.querySelector('[data-cell="Model!C63"]');
  if (projCell) {
    const pi = val('Model', 'C63');
    projCell.dataset.override = !isFinite(pi) ? 'n.m.' : pi > 1 ? 'over 100%' : '';
  }
}

function recalc() {
  cache = new Map();
  setDisplayOverrides();
  paintCells();

  document.querySelectorAll('[data-out]').forEach(o => {
    const [s, r] = o.dataset.out.split('!');
    o.textContent = txt(s, r);
    if (o.dataset.unit) o.appendChild($('span', 'u', o.dataset.unit));
  });
  const maxT = Math.max(...SITE.jobs.map(j => val('Career', 'F' + j.row)));
  document.querySelectorAll('[data-tbar]').forEach(b => {
    b.style.width = (val('Career', 'F' + b.dataset.tbar) / maxT * 100).toFixed(1) + '%';
  });

  const npvTile = document.querySelector('[data-tile="C55"]');
  if (npvTile) npvTile.classList.toggle('neg', val('Model', 'C55') < 0);

  const lev = document.getElementById('leverage');
  if (lev) lev.textContent = formatValue(val('Model', 'C51'), 'pct0');

  /* the sculpt always holds cover flat; whether it holds it AT the target
     depends on which of the two constraints is the binding one */
  const dn = document.getElementById('dscr-note');
  if (dn) {
    const capBinds = val('Model', 'C44') < val('Model', 'C42');
    dn.textContent = capBinds
      ? 'Flat by construction; the leverage cap binds before the covenant'
      : 'Flat by construction; the covenant is what sizes the loan';
  }

  const badge = document.getElementById('tie');
  if (badge) {
    const flag = val('Model', 'C61');
    badge.textContent = flag === 'OK' ? '✓ all three pass'
      : flag === 'NOT FINANCEABLE' ? '✗ not financeable: EBITDA turns negative inside the tenor'
      : '✗ CHECK';
    badge.classList.toggle('bad', flag !== 'OK');
  }

  drawCashflow();

  clearTimeout(heavyTimer);
  heavyTimer = setTimeout(heavy, 130);
}

function heavy() {
  /* "a quarter of the capital cost" has to move when either dial does */
  const en = document.querySelector('#analysis .em-n');
  if (en) {
    const b = val('Assumptions', 'C22'), g = val('Assumptions', 'C41');
    en.textContent = (g > 0 && isFinite(b / g)) ? formatValue(b / g, 'pct0') : 'a fraction';
  }
  /* the two capex benchmarks are quoted per kW, so they move with capacity */
  document.querySelectorAll('.fmkt[data-live]').forEach(w => {
    const d = w.__d; if (!d) return;
    const m = d.mkt(); if (!m) return;
    const f = d.mf || d.f, pre = d.mpre || '', suf = d.msuf || '';
    w.firstChild.textContent = pre + formatValue(m[0], f) + suf + '\u2013'
                             + pre + formatValue(m[1], f) + suf;
  });
  drawTrade();
  drawStress();      /* writes the headline as well as the table */
  drawTornado();
}

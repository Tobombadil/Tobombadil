<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrew T. Gibson — Origination Proposal</title>
<meta name="description" content="Andrew T. Gibson — origination, structuring and underwriting in wholesale power and energy infrastructure. Denver, CO. A proposal for a Manager, Origination seat, laid out the way a power-sector filing is, with a live model you can take apart.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fbfbf9'/%3E%3Cpath d='M2 4h12M2 8h12M2 12h12M6 2v12M10 2v12' stroke='%23d8d8d2' stroke-width='1'/%3E%3Crect x='6' y='4' width='4' height='4' fill='%231a3fcf' opacity='.8'/%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   A website in the language of a financial model.

   The page commits to a single visual world on purpose: a banker's working
   paper is white paper, and inverting it would break the conceit. Every
   color is an explicit token and the body paints its own ground, so the
   page holds whatever theme the host is in.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#ffffff;
  --paper-2:#f5f7f9;      /* neutrals biased toward the navy, so they read as chosen */
  --chrome:#eef1f5;
  --rule:#d3dae1;
  --rule-2:#e7ebf0;
  --ink:#10151c;          /* blue-black, not neutral black */
  --ink-2:#4c5661;
  --ink-3:#7d8791;
  --deep:#16324f;         /* slate navy: the document's structural voice */
  --deep-2:#0b1f33;
  --copper:#a8571c;       /* the one accent, spent sparingly */
  --copper-2:#c9762f;
  --input:#1e5aa8;        /* modeling convention: a stated figure */
  --linkc:#0f6b4a;        /* modeling convention: carried from another schedule */
  --prose:#2b333d;        /* body copy: softer than the ink, same blue bias */
  --bad:#a8302b;
  --series-1:#2a78d6;
  --series-2:#eb6834;
  --good:#12784f;
  --ground:#e7ebf1;      /* the desk the sheet sits on */
  --maxw:1120px;
  --sheet:1240px;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",Times,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:104px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.55 var(--sans);
  font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

/* The document is a sheet on a desk: the cover bleeds past it, everything
   below sits on white with the ground showing at the margins. Squared paper
   belonged to the version of this page that was a worksheet; behind running
   prose it is a repeating pattern with nothing to line up against. */
.toc,main > section,footer{
  max-width:var(--sheet);margin-left:auto;margin-right:auto;
  background:var(--paper);
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);
}

/* ── toolbar + provenance bar ──────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:40;background:var(--chrome);border-bottom:1px solid var(--rule);
     max-width:var(--sheet);margin-left:auto;margin-right:auto;
     border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.bar-in{max-width:var(--maxw);margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:18px;height:38px}
.fname{font:700 11px var(--sans);letter-spacing:.045em;white-space:nowrap}
.fname span{color:var(--ink-3);font-weight:400}
nav{margin-left:auto;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{display:block;padding:11px 13px;font:11px var(--sans);color:var(--ink-2);text-decoration:none;
      border-left:1px solid var(--rule);white-space:nowrap}
nav a:last-child{border-right:1px solid var(--rule)}
nav a:hover{color:var(--ink);background:var(--paper)}
nav a.on{color:var(--ink);font-weight:700;background:var(--paper);box-shadow:inset 0 -2px 0 var(--linkc)}
nav a:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--input);outline-offset:2px}

.fbar{position:sticky;top:38px;z-index:39;background:var(--paper);border-bottom:1px solid var(--rule);
      max-width:var(--sheet);margin-left:auto;margin-right:auto;
      border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.fbar-in{max-width:var(--maxw);margin:0 auto;padding:0 22px;display:flex;align-items:stretch;height:30px}
.fref{flex:0 0 auto;min-width:96px;max-width:210px;display:flex;align-items:center;gap:6px;
      font:600 11px var(--sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      border-right:1px solid var(--rule)}
.ffx{flex:0 0 34px;display:flex;align-items:center;justify-content:center;
     font:600 8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;
     color:var(--ink-3);border-right:1px solid var(--rule)}
.ftext{flex:1 1 auto;display:flex;align-items:baseline;gap:9px;padding:0 12px;min-width:0;
       font:12.5px/30px var(--sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftext .v{font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.ftext .p{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ── section furniture ─────────────────────────────────────────────── */
section{padding:52px 0 4px}
.shead{display:flex;align-items:baseline;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:6px;margin-bottom:22px}
.shead h2{margin:0;font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.shead .idx{font:400 10px var(--mono);color:var(--ink-3);letter-spacing:.04em}
.shead .rt{margin-left:auto;font:italic 11px var(--sans);color:var(--ink-3)}

/* ── hero ──────────────────────────────────────────────────────────── */
.hero{padding:46px 0 8px;display:grid;grid-template-columns:1.55fr 1fr;gap:44px;align-items:start}
h1{margin:10px 0 0;font:400 46px/1.06 var(--serif);letter-spacing:-.012em;text-wrap:balance}
.lede{margin:20px 0 0;max-width:60ch;font-size:14.5px;line-height:1.62;color:var(--prose)}

.covercard{border:1px solid var(--rule);background:var(--paper)}
.covercard h3{margin:0;padding:10px 14px;background:var(--chrome);border-bottom:1px solid var(--rule);
          font:600 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.crow{display:flex;gap:14px;padding:8px 13px;border-bottom:1px solid var(--rule-2);font-size:12.5px}
.crow:last-child{border-bottom:0}
.crow dt{flex:1 1 auto;margin:0;color:var(--ink-2)}
.crow dd{flex:0 0 auto;margin:0;text-align:right}
.crow a{color:var(--copper);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.legend{padding:10px 13px;border-top:1px solid var(--rule);background:var(--paper-2)}
.legend p{margin:0 0 5px;font:700 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.legend li{list-style:none;font-size:11.5px;color:var(--ink-2);line-height:1.7}
.legend ul{margin:0;padding:0}
.legend b{font-weight:700}

/* ── stat tiles ────────────────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--rule);background:var(--paper)}
.tile{padding:15px 16px;border-right:1px solid var(--rule)}
.tile:last-child{border-right:0}
.tile .k{font:700 9.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
         display:block;margin-bottom:7px}
.tile .v{font:400 27px/1 var(--serif);letter-spacing:-.01em;display:block}
.tile .u{font-size:11px;color:var(--ink-2);margin-top:5px;display:block}

/* ── ruled data rows ───────────────────────────────────────────────── */
.sched{width:100%;border-collapse:collapse;font-size:13px}
.sched th{font:700 10.5px var(--sans);letter-spacing:.05em;text-align:left;color:var(--ink-2);
          border-bottom:1px solid var(--ink-3);padding:0 10px 6px 0;white-space:nowrap}
.sched td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule-2);vertical-align:top;line-height:1.45}
.sched td.n,.sched th.n{text-align:right;white-space:nowrap}
.sched tbody tr:hover{background:var(--paper-2)}
.sched .desc{color:var(--ink-2);font-size:12.5px}
.chip{display:inline-block;padding:2px 7px;border:1px solid var(--rule);background:var(--paper-2);
      font:10.5px var(--sans);color:var(--ink-2);white-space:nowrap}
.chip.live{border-color:#c2d3ea;background:#eef3fa;color:var(--input)}

/* ── experience ────────────────────────────────────────────────────── */
.roles{display:flex;flex-direction:column;gap:0}
.job{padding:17px 0;border-bottom:1px solid var(--rule-2)}
.job:last-child{border-bottom:0}
.job-h{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline}
.job h3{margin:0;font:700 16px var(--sans)}
.job .co{margin:2px 0 0;font:italic 13.5px var(--serif);color:var(--ink-2)}
.job .when{text-align:right;font-size:12px;color:var(--ink-2);white-space:nowrap}
.job .when b{display:block;font:400 15px var(--serif);color:var(--ink)}
.tbar{height:5px;background:var(--rule-2);margin:11px 0 13px;position:relative}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);display:block}
.job ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.job li{padding-left:15px;position:relative;font-size:13.5px;line-height:1.55;color:var(--prose);max-width:78ch}
.job li::before{content:"—";position:absolute;left:0;color:var(--ink-3)}

/* ── the live model ────────────────────────────────────────────────── */
.model{display:grid;grid-template-columns:300px 1fr;gap:0;border:1px solid var(--rule);background:var(--paper)}
/* The dials stop where they stop rather than stretching to whichever readout
   is open, which otherwise left a tall empty panel under them, and they stay
   put while a long readout scrolls past. The divider moves to the outputs
   column, which always runs the full height of the row. */
.inputs{background:var(--paper-2);align-self:start;position:sticky;top:104px}
.inputs h3,.outputs h3{margin:0;padding:10px 14px;background:var(--chrome);border-bottom:1px solid var(--rule);
        font:700 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);
        display:flex;justify-content:space-between;align-items:center;gap:10px}
.reset{appearance:none;border:0;background:none;padding:0;cursor:pointer;
       font:400 10px var(--sans);letter-spacing:.02em;text-transform:none;color:var(--linkc);text-decoration:underline}
.fld{padding:11px 14px;border-bottom:1px solid var(--rule-2)}
.fld:last-child{border-bottom:0}
.fld-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.fld label{font-size:12px;color:var(--ink-2)}
.fld output{font:700 13px var(--sans);color:var(--input);font-variant-numeric:tabular-nums}
.fld .u{font-weight:400;font-size:10.5px;color:var(--ink-3);margin-left:3px}
/* the benchmark beside each dial: what the market expects, and who says so */
.fmkt{margin-top:6px;font:10.5px/1.45 var(--sans);color:var(--ink-3)}
.fmkt b{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fmkt i{font-style:normal;border-bottom:1px dotted var(--rule);cursor:help}
.bkey{margin:0;padding:10px 14px;border-top:1px solid var(--rule);
      font:10.5px/1.5 var(--sans);color:var(--ink-3)}
.bkey i{font-style:italic}
/* the range wraps to its own row, so each entry needs to read as one block
   rather than leaving its source floating between two figures */
.hfld li{flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--rule-2)}
.hfld li:last-child{border-bottom:0}
.hfld .fmkt{flex:1 0 100%;margin-top:1px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--rule);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--rule);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;
  border-radius:50%;background:var(--input);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--input);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:2px solid var(--paper);border-radius:50%;
  background:var(--input);box-shadow:0 0 0 1px var(--input)}
/* one instrument, three readouts. The tab strip is the outputs column's
   header, so it lines up with the Assumptions bar across the gutter. */
.outputs{min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--rule)}
.otabs{display:flex;background:var(--chrome);border-bottom:1px solid var(--rule)}
.otab{appearance:none;background:none;border:0;border-right:1px solid var(--rule);
      border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 16px;cursor:pointer;
      font:700 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.otab:hover{color:var(--ink)}
.otab[aria-selected=true]{background:var(--paper);color:var(--ink);border-bottom-color:var(--copper)}
.opane[hidden]{display:none}
.opane-cap{margin:0;padding:11px 14px;border-bottom:1px solid var(--rule-2);
           font:italic 11.5px var(--sans);color:var(--ink-3)}
/* held constant: inputs that do not move, so they live with the inputs */
.hfld{margin:0;padding:4px 14px 10px;list-style:none}
.hfld li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
         padding:4px 0;font-size:11.5px;line-height:1.5}
.hfld .k{color:var(--ink-2)}
.hfld .v{white-space:nowrap}
/* the footer closes the box across both columns */
.mfoot{grid-column:1/-1;border-top:1px solid var(--rule);background:var(--paper-2)}
.mfoot p{margin:0;padding:13px 14px;font-size:12.5px;line-height:1.6;color:var(--prose);max-width:92ch}
.mfoot b{color:var(--ink);font-weight:700}
.mfoot .tie{border-top:1px solid var(--rule-2);background:none;flex-wrap:wrap}
.otiles{display:grid;grid-template-columns:repeat(4,1fr)}
.otile{padding:14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.otile:nth-child(4){border-right:0}
.otile .k{font:700 9.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block}
.otile .v{font:400 26px/1.15 var(--serif);display:block;margin-top:6px}
.otile .n{font-size:10.5px;color:var(--ink-3);display:block;margin-top:3px}
.otile .v.neg{color:var(--bad)}
.viz{padding:16px 14px 6px}
.viz + .viz{border-top:1px solid var(--rule)}
.opane > .viz:first-of-type{padding-top:14px}
.viz h4{margin:0 0 2px;font:700 12px var(--sans)}
.viz .cap{margin:0 0 12px;font:italic 11px var(--sans);color:var(--ink-3);line-height:1.45}
.legend-row{display:flex;gap:16px;margin:0 0 10px;font-size:11px;color:var(--ink-2)}
.legend-row span{display:flex;align-items:center;gap:6px}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
.chartbox{overflow-x:auto}
.stress .u{color:var(--ink-3);font-size:11px}
/* it spans the two figure columns, so it must be allowed to wrap inside them
   rather than inherit the nowrap that keeps figures on one line */
.stress td.wide2{color:var(--ink-3);font-style:italic;white-space:normal}
/* the number the stress pane exists to produce */
.breakeven-line{margin:0 0 10px;font-size:13px;line-height:1.55;color:var(--prose)}
.breakeven-line b{color:var(--ink);font-weight:700;white-space:nowrap}
svg.chart{display:block;min-width:440px;width:100%;height:auto}
.tick{font:10px var(--sans);fill:var(--ink-3)}
.axis{stroke:var(--rule);stroke-width:1}
.gridline{stroke:var(--rule-2);stroke-width:1}
.tie{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--rule);
     background:var(--paper-2);font-size:12px;color:var(--ink-2)}
.tie b{color:var(--good);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.tie b.bad{color:var(--bad)}

.tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;
     background:var(--deep-2);color:#fff;padding:7px 9px;font:11px/1.5 var(--sans);max-width:230px;
     box-shadow:0 3px 12px rgba(0,0,0,.24)}
.tip.on{opacity:1}
.tip b{display:block;font-size:11px;margin-bottom:3px}
.tip i{font-style:normal;color:#9db2c6}

/* ── two-column lists ──────────────────────────────────────────────── */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:38px}
.blk h3{margin:0 0 10px;font:700 12px var(--sans)}
.deflist{margin:0;font-size:13px}
.deflist div{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--rule-2)}
.deflist dt{flex:0 0 34%;margin:0;color:var(--ink-2)}
.deflist dd{flex:1 1 auto;margin:0}
.paper{border:1px solid var(--rule);background:var(--paper);padding:16px 18px}
.paper h3{margin:0 0 4px;font:700 14px var(--sans)}
.paper .cap{margin:0 0 12px;font:italic 11.5px var(--sans);color:var(--ink-3)}
.paper p{margin:0 0 10px;font-size:13.5px;line-height:1.6;color:var(--prose);max-width:72ch}
.paper p:last-child{margin-bottom:0}

/* ══ presentation layer ═══════════════════════════════════════════════
   A power-sector proposal rendered as a scrolling presentation: a navy
   cover carrying a load shape, a contents page with dot leaders, and each
   section opening on a full-width divider band.
   ─────────────────────────────────────────────────────────────────── */

/* the chrome gets out of the way over the cover */
.bar,.fbar{transition:background .3s ease,border-color .3s ease,color .3s ease}
body.at-cover .bar,body.at-cover .fbar{background:transparent;border-bottom-color:rgba(255,255,255,.15);
  border-left-color:transparent;border-right-color:transparent}
body.at-cover .fname{color:#dde7f1}
body.at-cover .fname span{color:#8fa8c0}
body.at-cover nav a{color:#a8bed2;border-left-color:rgba(255,255,255,.15)}
body.at-cover nav a:last-child{border-right-color:rgba(255,255,255,.15)}
body.at-cover nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
body.at-cover nav a.on{color:#fff;background:rgba(255,255,255,.11);box-shadow:inset 0 -2px 0 var(--copper-2)}
body.at-cover .fref,body.at-cover .ffx{color:#8fa8c0;border-right-color:rgba(255,255,255,.15)}
body.at-cover .ftext{color:#8195a9}
@media (prefers-reduced-motion:reduce){.bar,.fbar{transition:none}}

.cover{position:relative;background:var(--deep-2);color:#eef2f6;overflow:hidden;
       margin-top:-68px;padding-top:68px;
       min-height:100vh;min-height:100svh;
       display:flex;flex-direction:column;
       background-image:radial-gradient(120% 90% at 12% 0%,#1d4166 0%,var(--deep-2) 62%)}
.cover .wrap{position:relative;z-index:2;width:100%}
.cover [data-cell]{color:#dde7f1}
.cover [data-cell].calc,.cover [data-cell].link{text-decoration-color:rgba(255,255,255,.4)}
.cover [data-cell].calc:hover,.cover [data-cell].link:hover{text-decoration-color:#fff}
.cover-top{padding-top:30px}
.cover-ref{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
           font:400 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;
           color:#8fa8c0;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.16)}
.cover-ref .dot{color:var(--copper-2)}
.cover-ref .rt{margin-left:auto}
.cover-mid{flex:1 1 auto;display:flex;align-items:center;padding:44px 0 34px}
.cover-eyebrow{font:500 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;
               color:var(--copper-2);margin:0 0 20px}
.cover h1{margin:0;font:300 clamp(46px,8.2vw,104px)/1.02 var(--serif);
          letter-spacing:-.022em;color:#fff;text-wrap:balance}
.cover-rule{width:78px;height:2px;background:var(--copper);margin:28px 0 22px}
.cover-sub{margin:0;max-width:34ch;font:400 clamp(17px,2.1vw,23px)/1.42 var(--serif);
           font-style:italic;color:#c3d2e0;text-wrap:balance}
.cover-meta{display:flex;gap:34px;flex-wrap:wrap;margin-top:30px;
            font:400 12.5px var(--sans);color:#9db2c6}
.cover-meta b{display:block;font:500 10px var(--sans);letter-spacing:.15em;
              text-transform:uppercase;color:#6f89a2;margin-bottom:4px}
.cover-meta span{color:#dde6ee}
.cover-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:32px}
.cover-cta a{display:inline-flex;align-items:center;padding:10px 18px;
             font:500 12.5px var(--sans);text-decoration:none;border:1px solid rgba(255,255,255,.3);
             color:#eef2f6}
.cover-cta a:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.55)}
.cover-cta a.solid{background:var(--copper);border-color:var(--copper);color:#fff}
.cover-cta a.solid:hover{background:var(--copper-2);border-color:var(--copper-2)}

/* the load shape sits on the cover's floor */
.cover-load{position:relative;z-index:1;margin-top:auto}
.cover-load svg{display:block;width:100%;height:clamp(120px,20vh,210px)}
.cover-cap{padding-bottom:20px;font:400 10.5px var(--sans);color:#7f96ac;
           display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cover-cap i{font-style:normal;color:#5f7a94}
.cover-cap .key{display:inline-flex;align-items:center;gap:6px;color:#9db2c6}
.cover-cap .sw{width:9px;height:9px;display:inline-block;border-radius:1px}

/* contents, set the way a filing sets one */
.toc{background:var(--paper-2);border-bottom:1px solid var(--rule)}
.toc .wrap{padding-top:40px;padding-bottom:40px}
.toc h2{margin:0 0 22px;font:500 10.5px var(--sans);letter-spacing:.2em;
        text-transform:uppercase;color:var(--ink-3)}
.toc ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;
        gap:0 46px}
.toc li{border-top:1px solid var(--rule)}
.toc li:nth-child(-n+2){border-top:0}
.toc a{display:flex;align-items:baseline;gap:12px;padding:13px 0;text-decoration:none;color:inherit}
.toc a:hover .tname{color:var(--copper)}
.toc .tnum{flex:0 0 34px;font:500 11.5px var(--mono);color:var(--copper);letter-spacing:.02em}
.toc .tname{font:500 15px var(--sans);color:var(--ink);white-space:nowrap}
.toc .lead{flex:1 1 auto;border-bottom:1.5px dotted #b4bfca;transform:translateY(-4px)}

/* section dividers */
section{padding:0 0 4px}
.divider{background:var(--deep);color:#fff;margin-bottom:28px}
.divider .wrap{padding-top:26px;padding-bottom:26px;display:grid;
               grid-template-columns:auto 1fr;gap:4px 22px;align-items:baseline}
.divider .num{grid-row:1/3;font:300 clamp(34px,5vw,58px)/.9 var(--serif);
              color:var(--copper-2);letter-spacing:-.02em}
.divider h2{margin:0;font:500 15px var(--sans);letter-spacing:.19em;text-transform:uppercase}
.divider .thesis{margin:0;font:italic 15px/1.45 var(--serif);color:#a9c0d6;max-width:62ch}
section > .wrap.body{padding-bottom:44px}

/* a wider, calmer type scale for the document body */
.lede{font-size:15.5px;line-height:1.68}
.sched td{line-height:1.55}
.sched.pairs td:last-child,.sched.risk td{font-size:13px;line-height:1.65}

@media (max-width:820px){
  .toc ol{grid-template-columns:1fr}
  .toc li:nth-child(2){border-top:1px solid var(--rule)}
  .cover-meta{gap:22px}
}
@media (max-width:680px){
  .cover-top{padding-top:22px}
  .cover-mid{padding:32px 0 26px}
  .cover-sub{font-size:16px}
  .divider .wrap{grid-template-columns:1fr;gap:6px}
  .divider .num{grid-row:auto}
  .divider .thesis{font-size:14px}
}

.hero{padding-top:26px}
/* the terms rows carry long values now, so the value wraps and the label holds */
.crow dt{flex:0 0 auto}
.crow dd{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}

/* the mandate map and the risk register both ride on .sched */
.sched.pairs td{padding:12px 16px 12px 0;font-size:13px;vertical-align:top}
.sched.pairs td:first-child{width:37%}
.sched.pairs td:last-child{color:var(--prose);line-height:1.6}
.sched.pairs .own{display:block;font-weight:700}
.sched.pairs .owd{display:block;margin-top:3px;color:var(--ink-3);font-size:11.5px;line-height:1.5}
.sched.risk td{vertical-align:top;line-height:1.6;font-size:12.5px;color:var(--prose)}
.sched.risk td:first-child{width:24%;font-weight:700;color:var(--ink)}
.sched.risk td:nth-child(2){width:33%;color:var(--ink-2)}

.steps{margin:0;padding-left:20px;font-size:13px;line-height:1.6;color:var(--prose)}
.steps li{margin-bottom:9px}

/* ── ranked sensitivity ────────────────────────────────────────────── */
.torn{width:100%;border-collapse:collapse;font-size:12.5px}
.torn th{font:700 10.5px var(--sans);letter-spacing:.05em;text-align:left;color:var(--ink-2);
         border-bottom:1px solid var(--ink-3);padding:0 10px 6px 0;white-space:nowrap}
.torn th.n{text-align:right}
.torn th.c{text-align:center}
.torn td{padding:6px 10px 6px 0;border-bottom:1px solid var(--rule-2);white-space:nowrap}
.torn td.lbl{white-space:normal;width:34%;padding-right:20px}
.torn td.bar{width:66%;padding-right:4px}
/* the axis, carried in the header so every bar below is read against it */
.tax{padding:0 0 3px}
.taxdir{display:flex;justify-content:space-between;align-items:baseline;
        font:600 9px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.taxdir .w{color:var(--bad)}
.taxdir .b{color:var(--good)}
.taxdir .w::before{content:'← '}
.taxdir .b::after{content:' →'}
.taxs{position:relative;height:15px;margin-top:5px;font:400 9.5px var(--mono);
      color:var(--ink-3);letter-spacing:0;text-transform:none}
.taxs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.taxs span::after{content:'';position:absolute;left:50%;top:13px;width:1px;height:4px;
                  background:var(--rule)}
.taxs .edge.l{transform:translateX(0)}
.taxs .edge.l::after{left:0}
.taxs .edge.r{transform:translateX(-100%)}
.taxs .edge.r::after{left:auto;right:0}
.taxs .zero{color:var(--ink);font-weight:500}
.taxs .zero::after{background:var(--ink-3);height:6px}
/* no track: the grey band behind every bar read as a grid and said nothing */
.tb{position:relative;height:13px}
.tb i{position:absolute;top:0;bottom:0;display:block;cursor:default}
.tb i:focus-visible{outline:2px solid var(--input);outline-offset:2px}
.tb i.up{background:var(--good)}
.tb i.dn{background:var(--bad)}
.tb u{position:absolute;left:50%;top:-7px;bottom:-7px;width:1px;background:var(--ink-3);opacity:.45}

/* ── contact + footer ──────────────────────────────────────────────── */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:start}
a.mail{color:var(--linkc);text-decoration:underline;text-underline-offset:2px}
footer{margin-top:0;border-top:1px solid var(--rule);background:var(--paper-2)}
footer .wrap{padding-top:30px;padding-bottom:34px}
footer p{margin:0 0 6px;font:italic 11px var(--sans);color:var(--ink-3);line-height:1.6;max-width:86ch}

/* input groups, elections and the held-constant list */
  .igrp{border-bottom:1px solid var(--rule)}
  .igh{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
       background:none;border:0;padding:9px 14px;cursor:pointer;text-align:left;color:var(--ink-2);
       font:700 9.5px var(--sans);letter-spacing:.11em;text-transform:uppercase}
  .igh:hover{color:var(--ink)}
  .igh .chev{font-size:9px;color:var(--ink-3);transition:transform .16s}
  .igh:hover .chev{color:var(--copper)}
  .igrp[data-open="0"] .igh{color:var(--ink-3)}
  .igrp[data-open="0"] .chev{transform:rotate(-90deg)}
  .igrp[data-open="0"] .igb{display:none}
  .igb{padding-bottom:4px}
  .fld select{width:100%;font:12px var(--sans);padding:5px 6px;border:1px solid var(--rule);
              background:var(--paper);color:var(--input);font-weight:700}

  /* capital stack strip */
  .stack{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule)}
  .sitem{padding:10px 14px;border-right:1px solid var(--rule)}
  .sitem:last-child{border-right:0}
  .sitem .k{display:block;font:700 9px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
  .sitem .v{display:block;font:400 16px var(--serif);margin-top:3px}

  /* stress table. The 430px floor is what made the six columns scroll; on a
     phone it drops to three that fit, so the floor would fight them. */
  table.stress{font-size:12.5px}
  @media (min-width:681px){table.stress{min-width:430px}}
  table.stress td{padding:7px 10px 7px 0}
  table.stress tr.key{background:var(--paper-2)}
  table.stress tr.key td{font-weight:700}
  table.stress td.muted{color:var(--ink-3)}
  table.stress td.bad{color:var(--bad)}
  #stress{overflow-x:auto;padding-bottom:4px}

  /* values wired to the workbook get a quiet affordance */
[data-cell]{cursor:help;text-decoration:underline;
            text-decoration-style:dotted;text-decoration-color:var(--rule);text-underline-offset:3px}
[data-cell]:hover,[data-cell]:focus-visible{text-decoration-color:var(--ink-3)}
.calc{color:var(--ink)}
.link{color:var(--linkc)}
.hard{color:var(--input)}

@media (max-width:960px){
  .hero{grid-template-columns:1fr;gap:30px}
  .model{grid-template-columns:1fr}
  .inputs{border-right:0;border-bottom:1px solid var(--rule)}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tile:nth-child(2){border-right:0}
  .tile:nth-child(1),.tile:nth-child(2){border-bottom:1px solid var(--rule)}
  .cols,.contact{grid-template-columns:1fr;gap:26px}
}
@media (max-width:680px){
  html{scroll-padding-top:96px}
  .wrap{padding:0 15px}
  .bar-in,.fbar-in{padding:0 15px}
  h1{font-size:33px}
  section{padding:38px 0 4px}
  .otiles{grid-template-columns:repeat(2,1fr)}
  .otile:nth-child(2){border-right:0}
  .fref{flex-basis:74px;font-size:10px}
  .job-h{grid-template-columns:1fr}
  .job .when{text-align:left}
  .job .when b{display:inline;margin-right:7px}
  .deflist div{flex-direction:column;gap:2px}
  .deflist dt{flex-basis:auto}
  .sched thead{display:none}
  .sched tr{display:block;padding:12px 0;border-bottom:1px solid var(--rule-2)}
  .sched td{display:block;border:0;padding:1px 0}
  .sched td.n{text-align:left}
  .sched td[data-l]::before{content:attr(data-l) " ";color:var(--ink-3);font-size:11px}
  .sched.pairs td:first-child,.sched.risk td:first-child,
  .sched.risk td:nth-child(2){width:auto}
  .sched.pairs td,.sched.risk td{padding:2px 0}
  .sched.pairs tr,.sched.risk tr{padding:14px 0}
  .sched.pairs .owd{margin-bottom:7px}
  .sched.risk td:nth-child(2),.sched.risk td:nth-child(3){margin-top:6px;display:block}
  .crow{flex-direction:column;gap:2px}
  .crow dd{text-align:left}
  /* Auto layout ignored the percentages here: the numeric columns and the
     axis header set a min-content floor that decided the split for it, and
     the names wrapped four deep. Fixed layout takes the columns from the
     header row, so both have to be given the width. */
  .torn{table-layout:fixed;width:100%}
  .torn td.lbl,.torn th:first-child{width:42%;white-space:normal}
  .torn td.bar,.torn th.c{width:58%;padding-right:4px}
  .taxdir{font-size:8px;letter-spacing:.05em}
  /* the centre label is the caption's job at this width, and five ticks
     collide in 110px */
  .taxdir{font-size:8px;letter-spacing:.06em}
  .taxdir span:nth-child(2){display:none}
  .taxs{font-size:8.5px}
  .taxs .mid{display:none}
  .torn{font-size:11.5px}
}
/* ══ phone ════════════════════════════════════════════════════════════
   Audited at 390x844. The nav could show one of eight links, the source
   bar truncated every sentence it was given, and the assumption panel
   pushed the model's own outputs below the fold. */
nav a .n,nav a .s{display:none}
nav a .n{font:600 11px var(--mono);letter-spacing:.02em}
@media (max-width:680px){
  html{scroll-padding-top:56px}
  .bar-in{height:46px}
  .fname{display:none}
  nav{margin-left:0;width:100%}
  nav a{display:flex;align-items:center;height:46px;padding:0 7px;font-size:11px}
  nav a .n{display:inline}
  nav a .t{display:none}
  nav a.on .n{color:var(--copper)}
  nav a.on .s{display:inline;margin-left:6px;font-size:11.5px;font-weight:600}
  /* the bar cannot hold a sentence at this width; the tooltip can */
  .fbar{display:none}
  .cover{margin-top:-47px;padding-top:47px}
  .tip{max-width:290px;font-size:12px;padding:9px 11px}
  .tip b{font-size:12px;margin-bottom:4px}

  /* thumbs need 44px; these were 36 and 38 */
  .cover-cta a{padding:14px 20px;font-size:13px}
  .igh{padding:13px 14px}
  .reset{padding:6px 0}

  /* labels that had dropped under 12px */
  .cover-eyebrow{font-size:12px}
  .cover-cap{font-size:11px}
  .toc .tnum{font-size:12px}
  .sched.pairs .owd{font-size:12.5px}
  .torn{font-size:12px}
  .viz .cap{font-size:12px}
  .legend li{font-size:12px}
  .tile .u,.otile .n{font-size:11.5px}

  /* a box that scrolls sideways should say so */
  .viz.wide > h4::after{content:' ·  scrolls sideways';font:italic 10.5px var(--sans);
                        color:var(--ink-3);letter-spacing:0;text-transform:none}

  /* 6.0: three readouts, one at a time. The tabs share the width and get
     thumb-sized targets. */
  .inputs{position:static}
  .otab{flex:1 1 0;min-width:0;padding:13px 4px;font-size:9.5px;letter-spacing:.08em}
  .opane-cap{padding:10px 14px;font-size:11.5px}
  .otile{padding:12px}
  .otile .v{font-size:23px}

  /* The generic .sched rule restacks any schedule into records on a phone,
     which turned this into ten rows of four unlabelled numbers. It stays a
     table, on fixed layout so the names take the slack and the three figure
     columns are pinned to what a figure needs. */
  .sched.stress{display:table;table-layout:fixed;width:100%;font-size:12px}
  .sched.stress td:first-child,.sched.stress th:first-child{width:44%;white-space:normal}
  .sched.stress td.n,.sched.stress th.n{width:18.6%}
  .sched.stress thead{display:table-header-group}
  .sched.stress tr{display:table-row;padding:0;border:0}
  .sched.stress td{display:table-cell;padding:8px 5px 8px 0;border-bottom:1px solid var(--rule-2)}
  .sched.stress td.n{text-align:right}
  .sched.stress th{padding:0 5px 7px 0;font-size:9.5px;white-space:normal;line-height:1.3}
  .sched.stress .u{display:block;margin-left:0}
}

         mkt:[0.02,0.03],   s:'IND'},
    C15:{v:1.39,  f:'num2', mkt:[1.2,1.6], s:'IND'},

/* ═══════════════════════════════════════════════════════════════════════
   2. FORMULA ENGINE
   Recursive-descent parser, no eval. Lazy evaluation with memoisation and
   circular-reference detection. Dates are Excel serials on the 1899-12-30
   epoch, so date arithmetic behaves as it does in a real workbook.
   ═══════════════════════════════════════════════════════════════════════ */

const SHEET_BY_NAME = Object.fromEntries(SHEETS.map(s => [s.name, s]));
const overrides = Object.create(null);
let cache = new Map();
const evalStack = new Set();

const EPOCH = Date.UTC(1899, 11, 30);
const serial = (y, m, d) => Math.round((Date.UTC(y, m - 1, d) - EPOCH) / 864e5);
const fromSerial = s => new Date(EPOCH + Math.round(s) * 864e5);
const todaySerial = () => { const n = new Date(); return serial(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
const colLetter = i => { let s = '', n = i + 1; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const colIndex = L => { let n = 0; for (const ch of L) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };

const RE_NUM = /^\d+(?:\.\d+)?/;
const RE_STR = /^"([^"]*)"/;
const RE_REF = /^(?:([A-Za-z][A-Za-z0-9_]*)!)?\$?([A-Z]{1,2})\$?(\d{1,4})(?![A-Za-z0-9_])/;
const RE_ID  = /^[A-Za-z][A-Za-z0-9_.]*/;
const RE_OP  = /^(<=|>=|<>|[+\-*/^&(),:<>=])/;

function tokenize(src) {
  const out = []; let s = src;
  while (s.length) {
    if (/^\s/.test(s)) { s = s.replace(/^\s+/, ''); continue; }
    let m;
    if ((m = RE_STR.exec(s))) { out.push({ t:'str', v:m[1] }); s = s.slice(m[0].length); continue; }
    if ((m = RE_NUM.exec(s))) { out.push({ t:'num', v:parseFloat(m[0]) }); s = s.slice(m[0].length); continue; }
    if ((m = RE_REF.exec(s))) { out.push({ t:'ref', sheet:m[1] || null, col:m[2], row:+m[3] }); s = s.slice(m[0].length); continue; }
    if ((m = RE_ID.exec(s)))  { out.push({ t:'id', v:m[0].toUpperCase() }); s = s.slice(m[0].length); continue; }
    if ((m = RE_OP.exec(s)))  { out.push({ t:'op', v:m[0] }); s = s.slice(m[0].length); continue; }
    throw new Error('#SYNTAX!');
  }
  return out;
}

const flat = a => a.flatMap(x => Array.isArray(x) ? x : [x]);
const nums = a => flat(a).filter(v => typeof v === 'number' && isFinite(v));

const FN = {
  SUM:a => nums(a).reduce((x, y) => x + y, 0),
  MAX:a => { const n = nums(a); return n.length ? Math.max(...n) : 0; },
  MIN:a => { const n = nums(a); return n.length ? Math.min(...n) : 0; },
  ABS:a => Math.abs(+a[0]),
  IF:a => (a[0] ? a[1] : a[2] !== undefined ? a[2] : false),
  TODAY:() => todaySerial(),
  DATE:a => serial(+a[0], +a[1], +a[2]),
  YEARFRAC:a => (+a[1] - +a[0]) / 365.25,
  IRR:a => {
    const cf = nums(a);
    if (cf.length < 2) return NaN;
    const npv = r => cf.reduce((s, c, i) => s + c / Math.pow(1 + r, i), 0);
    let lo = -0.9999, hi = 10, flo = npv(lo), fhi = npv(hi);
    if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return NaN;
    for (let i = 0; i < 200; i++) {
      const mid = (lo + hi) / 2, f = npv(mid);
      if (f === 0) return mid;
      if (flo * f < 0) { hi = mid; fhi = f; } else { lo = mid; flo = f; }
    }
    return (lo + hi) / 2;
  },
};

function evaluate(src, ctxSheet) {
  const tk = tokenize(src);
  let p = 0;
  const peek = () => tk[p];
  const isOp = v => peek() && peek().t === 'op' && peek().v === v;
  const eat = v => { if (!isOp(v)) throw new Error('#SYNTAX!'); p++; };

  function primary() {
    const t = peek();
    if (!t) throw new Error('#SYNTAX!');
    if (t.t === 'num' || t.t === 'str') { p++; return t.v; }
    if (t.t === 'op' && t.v === '(') { p++; const v = expr(); eat(')'); return v; }
    if (t.t === 'op' && t.v === '-') { p++; return -primary(); }
    if (t.t === 'op' && t.v === '+') { p++; return primary(); }
    if (t.t === 'ref') {
      p++;
      if (isOp(':') && tk[p + 1] && tk[p + 1].t === 'ref') { p++; const b = tk[p++]; return readRange(t, b, ctxSheet); }
      return readCell(t.sheet || ctxSheet, t.col + t.row);
    }
    if (t.t === 'id') {
      p++;
      const name = t.v;
      if (!isOp('(')) throw new Error('#NAME?');
      eat('(');
      const args = [];
      if (!isOp(')')) { args.push(expr()); while (isOp(',')) { p++; args.push(expr()); } }
      eat(')');
      const fn = FN[name];
      if (!fn) throw new Error('#NAME?');
      return fn(args);
    }
    throw new Error('#SYNTAX!');
  }
  function power(){ let v = primary(); while (isOp('^')) { p++; v = Math.pow(v, primary()); } return v; }
  function term(){ let v = power(); while (isOp('*') || isOp('/')) { const o = peek().v; p++; const r = power(); v = o === '*' ? v * r : (r === 0 ? NaN : v / r); } return v; }
  function add(){ let v = term(); while (isOp('+') || isOp('-')) { const o = peek().v; p++; const r = term(); v = o === '+' ? v + r : v - r; } return v; }
  function concat(){ let v = add(); while (isOp('&')) { p++; v = fmtConcat(v) + fmtConcat(add()); } return v; }
  function expr() {
    let v = concat();
    while (peek() && peek().t === 'op' && ['<','>','=','<=','>=','<>'].includes(peek().v)) {
      const o = peek().v; p++; const r = concat();
      v = o === '<' ? v < r : o === '>' ? v > r : o === '=' ? v === r
        : o === '<=' ? v <= r : o === '>=' ? v >= r : v !== r;
    }
    return v;
  }
  const result = expr();
  if (p !== tk.length) throw new Error('#SYNTAX!');
  return result;
}

const fmtConcat = v => typeof v === 'number' ? group(v, Math.abs(v % 1) > 1e-9 ? 1 : 0) : String(v);

function readRange(a, b, ctxSheet) {
  const sheet = a.sheet || ctxSheet;
  const c1 = colIndex(a.col), c2 = colIndex(b.col), r1 = a.row, r2 = b.row;
  const out = [];
  for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++)
    for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++)
      out.push(readCell(sheet, colLetter(c) + r));
  return out;
}

function rawOf(sheetName, ref) {
  const key = sheetName + '!' + ref;
  if (key in overrides) return overrides[key];
  const sh = SHEET_BY_NAME[sheetName];
  if (!sh) return '';
  const cell = sh.cells[ref];
  return cell ? cell.v : '';
}

function readCell(sheetName, ref) {
  const key = sheetName + '!' + ref;
  if (cache.has(key)) return cache.get(key);
  if (evalStack.has(key)) throw new Error('#CIRC!');
  const raw = rawOf(sheetName, ref);
  let val;
  if (raw === '' || raw === null || raw === undefined) val = 0;
  else if (typeof raw === 'number') val = raw;
  else if (typeof raw === 'string' && raw[0] === '=') {
    evalStack.add(key);
    try { val = evaluate(raw.slice(1), sheetName); }
    catch (e) { val = (e && /^#/.test(e.message)) ? e.message : '#ERROR!'; }
    finally { evalStack.delete(key); }
  } else val = raw;
  cache.set(key, val);
  return val;
}

/* ---- formatting ---- */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function group(v, dec) {
  const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec });
  const neg = v < 0 && parseFloat(s.replace(/,/g, '')) !== 0;
  return neg ? '(' + s + ')' : s;
}
function formatValue(v, f) {
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (typeof v === 'string') return v;
  if (v === null || v === undefined) return '';
  if (typeof v !== 'number' || !isFinite(v)) return '—';
  switch (f) {
    case 'num0': return group(v, 0);
    case 'num1': return group(v, 1);
    case 'num2': return group(v, 2);
    case 'num3': return group(v, 3);
    case 'x2':   return group(v, 2) + 'x';
    case 'pct0': return group(v * 100, 0) + '%';
    case 'pct1': return group(v * 100, 1) + '%';
    case 'usd':  return '$' + group(v, 0);
    case 'date': { const d = fromSerial(v); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
    case 'mmmyy':{ const d = fromSerial(v); return MONTHS[d.getUTCMonth()] + ' ’' + String(d.getUTCFullYear()).slice(2); }
    default:     return group(v, Math.abs(v % 1) > 1e-9 ? 1 : 0);
  }
}
const val = (sheet, ref) => readCell(sheet, ref);
const txt = (sheet, ref, f) => formatValue(readCell(sheet, ref), f || (SHEET_BY_NAME[sheet].cells[ref] || {}).f);

const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (t, attrs) => { const e = document.createElementNS(SVGNS, t); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* A figure wired to the workbook. It knows its own cell, so it can show its formula. */
/* A figure's color is not a styling choice — it reports what the cell actually
   holds, which is the whole point of the convention. Classified at paint time so
   an overridden input correctly turns blue. */
function cellKind(sheet, ref) {
  const raw = rawOf(sheet, ref);
  if (typeof raw !== 'string' || raw[0] !== '=') return 'hard';
  return /[A-Za-z][A-Za-z0-9_]*!/.test(raw) ? 'link' : 'calc';
}

function cell(sheet, ref, opts = {}) {
  const e = $(opts.tag || 'span', opts.cls || '');
  e.dataset.cell = sheet + '!' + ref;
  if (opts.f) e.dataset.f = opts.f;
  return e;
}

function paintCells(root = document) {
  root.querySelectorAll('[data-cell]').forEach(e => {
    const [sheet, ref] = e.dataset.cell.split('!');
    const v = readCell(sheet, ref);
    e.textContent = e.dataset.override
      ? e.dataset.override
      : formatValue(v, e.dataset.f || (SHEET_BY_NAME[sheet].cells[ref] || {}).f);
    const kind = cellKind(sheet, ref);
    e.classList.remove('hard', 'calc', 'link');
    e.classList.add(kind);
    /* every figure can now say where it came from, including the stated ones,
       so every figure is reachable. Color still carries the convention. */
    e.tabIndex = 0;
  });
}

/* the provenance bar */
function showSource(sheet, ref, el) {
  const key = sheet + '!' + ref;
  const meta = SRC[key];
  const kind = cellKind(sheet, ref);
  /* an output the page deliberately overrides (n.m., over 100%) must read
     the same in the bar as it does on the page */
  const over = el && el.dataset.override;
  const raw = over || txt(sheet, ref, el && el.dataset.f);
  /* the page wraps most figures in a unit the cell itself does not carry, so
     the bar has to put it back or it prints a bare 1,300 for $1,300M */
  const shown = (over || !meta) ? raw : (meta[2] || '') + raw + (meta[3] || '');
  fref.textContent = meta ? meta[0] : ref;
  ftext.textContent = '';
  const v = $('b', 'v ' + kind, shown);
  const prose = $('span', 'p', meta ? expandSrc(sheet, meta[1])
    : kind === 'hard' ? 'A stated figure.' : 'Worked out on this page.');
  ftext.append(v, prose);
}
const HINT = matchMedia('(hover: none)').matches
  ? 'Tap any underlined figure to see where it comes from'
  : 'Hover any underlined figure to see where the number comes from';
function clearSource() {
  fref.textContent = '—';

/* The bar has 210px on a phone for a sentence that needs 297, so it truncates
   every source line. Below 680px the bar is hidden and the same content goes
   to the tooltip, which wraps. */
const narrow = () => matchMedia('(max-width:680px)').matches;
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));

function reveal(el) {
  const [sheet, ref] = el.dataset.cell.split('!');
  if (!narrow()) { showSource(sheet, ref, el); return; }
  const meta = SRC[sheet + '!' + ref];
  const over = el.dataset.override;
  const raw = over || txt(sheet, ref, el.dataset.f);
  const shown = (over || !meta) ? raw : (meta[2] || '') + raw + (meta[3] || '');
  const prose = meta ? expandSrc(sheet, meta[1])
    : cellKind(sheet, ref) === 'hard' ? 'A stated figure.' : 'Worked out on this page.';
  const b = el.getBoundingClientRect();
  showTip('<b>' + esc((meta ? meta[0] : ref) + '  ' + shown) + '</b>' + esc(prose),
          b.left + b.width / 2, b.top);
}

document.addEventListener('pointerover', e => {

document.addEventListener('focusin', e => {

document.addEventListener('pointerout', e => {

/* A summer weekday load shape with a storage dispatch overlay. It is on the
   cover because it is the one graphic everyone in this industry reads without
   a legend, and because the simulator behind it is his own work (5.0). The
   shape is illustrative and says so; nothing on the page depends on it. */
const LOAD = [42,39,37,36,36,38,43,50,57,63,68,73,79,85,91,96,100,97,88,78,69,60,52,46];
const DISPATCH = ['c','c','c','c','c','c','','','','','','','','','d','d','d','d','d','','','','',''];

function drawCover(host){
  const W = 1200, H = 220, pad = 8;
  const svg = svgEl('svg', { viewBox:`0 0 ${W} ${H}`, preserveAspectRatio:'none',
                             'aria-hidden':'true', focusable:'false' });
  const n = LOAD.length;
  const x = i => (i / (n - 1)) * W;
  const lo = Math.min(...LOAD), hi = Math.max(...LOAD);
  const y = v => H - pad - ((v - lo) / (hi - lo)) * (H - pad * 2 - 26);

  const pts = LOAD.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  svg.appendChild(svgEl('polygon', {
    points:`0,${H} ` + pts.join(' ') + ` ${W},${H}`, fill:'rgba(255,255,255,.05)' }));

  /* the dispatch windows are tinted area under the curve, not bands over it:
     charging in the trough, discharging into the peak */
  const runs = kind => {
    const out = []; let s = null;
    DISPATCH.forEach((d, i) => {
      if (d === kind) { if (s === null) s = i; }
      else if (s !== null) { out.push([s, i - 1]); s = null; }
    });
    if (s !== null) out.push([s, DISPATCH.length - 1]);
    return out;
  };
  /* the fill is a tint; the signal is the curve segment sitting on top of it,
     so a tall peak does not turn into a slab of color */
  [['c', 'rgba(84,158,232,.11)', '#63a8ee'], ['d', 'rgba(232,140,60,.13)', '#ef9a52']]
    .forEach(([k, fill, stroke]) => {
    runs(k).forEach(([a, b]) => {
      const seg = [];
      for (let i = a; i <= b; i++) seg.push(pts[i]);
      svg.appendChild(svgEl('polygon', {
        points:`${x(a).toFixed(1)},${H} ` + seg.join(' ') + ` ${x(b).toFixed(1)},${H}`, fill }));
      svg.appendChild(svgEl('polyline', { points:seg.join(' '), fill:'none',
        stroke, 'stroke-width':'3.5', 'stroke-linecap':'round', 'stroke-linejoin':'round' }));
    });
  });

  const line = svgEl('polyline', { points:pts.join(' '), fill:'none',
    stroke:'#cfe0f0', 'stroke-width':'2', 'stroke-linejoin':'round', 'stroke-linecap':'round' });
  svg.appendChild(line);

  /* the peak needs no marker: the copper segment already sits on it */
  host.appendChild(svg);

  /* one orchestrated moment: the curve draws itself in on load */
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    try {
      const len = line.getTotalLength();
      line.style.strokeDasharray = len;
      line.style.strokeDashoffset = len;
      line.style.transition = 'stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)';
      requestAnimationFrame(() => { line.style.strokeDashoffset = '0'; });
    } catch (e) { /* getTotalLength is unsupported somewhere: leave it drawn */ }
  }
}

const INPUT_GROUPS = (() => {

/* Run the model under a temporary set of inputs, then put everything back.
   This is what lets the stress tests, the breakeven solve and the sensitivity
   grid each be real model runs rather than a second, simplified formula. */
function underScenario(temp, read) {
  const savedOv = Object.assign(Object.create(null), overrides);
  const savedCache = cache;
  Object.assign(overrides, temp);
  cache = new Map();
  try { return read(); }
  finally {
    for (const k in overrides) delete overrides[k];
    Object.assign(overrides, savedOv);
    cache = savedCache;
  }
}

/* ── how much room each assumption has ───────────────────────────────
   The old pane shocked seven inputs by fixed amounts — capex +25%, price
   −15% — and printed the NPV that fell out. Nothing said whether 25% was
   a lot, so the figures had no reference. These answer the question those
   shocks were reaching for: how far can this move before equity is worth
   nothing, and what move is that.

   Every solve re-runs the whole model, debt included: a worse assumption
   is a differently-sized loan, because you would have underwritten it
   that way. That keeps one basis across every row. */

const NPV = () => val('Model', 'C55');

/* $20k of NPV, on an answer measured in tens of millions and printed to the
   hundred thousand: close enough to call zero, and reached in a dozen steps */
const EPS = 0.02;

/* Which way this input has to move for equity NPV to fall. The model says,
   rather than a hand-kept list: capex up hurts, price down hurts, and a
   driver whose sign flips as the deal changes stays correct. */
function adverseDir(ref) {
  const d = SHEET_BY_NAME['Assumptions'].cells[ref];
  const v0 = val('Assumptions', ref);
  const h = Math.max(Math.abs(v0) * 0.02, d.step || 0.01);
  const f = x => underScenario({ ['Assumptions!' + ref]:x }, NPV);
  const up = f(Math.min(d.max, v0 + h)), dn = f(Math.max(d.min, v0 - h));
  const bad = v => isFinite(v) ? v : -Infinity;   /* unfinanceable is worse */
  return bad(dn) < bad(up) ? -1 : 1;
}

/* Bisect for the value at which equity NPV reaches zero, moving the input
   the adverse way, as far as its own declared range allows. */
function driverBreakeven(ref, dir, base = NPV()) {
  const d = SHEET_BY_NAME['Assumptions'].cells[ref];
  const v0 = val('Assumptions', ref), lim = dir > 0 ? d.max : d.min;
  const f = x => underScenario({ ['Assumptions!' + ref]:x }, NPV);
  const gone = v => !isFinite(v) || v <= 0;
  if (gone(base)) return null;                   /* already at or below zero */
  if (!gone(f(lim))) return { out:true };        /* survives its whole range */
  /* Stop on the answer, not on the input. A tolerance in input units means a
     different thing for every driver — half a dollar on the PPA price is a
     million of NPV, half a dollar on capex is nothing — so bisect until NPV
     is within EPS of zero and let each driver take the steps it needs. Every
     step is a full run of the model, ten times over. */
  let a = v0, b = lim, at = (a + b) / 2;
  for (let i = 0; i < 30; i++) {
    const m = (a + b) / 2, v = f(m);
    at = m;
    if (isFinite(v) && Math.abs(v) < EPS) return { at, pct:v0 === 0 ? NaN : (at - v0) / Math.abs(v0) };
    if (gone(v)) b = m; else a = m;
    at = (a + b) / 2;
  }
  return { at, pct:v0 === 0 ? NaN : (at - v0) / Math.abs(v0) };
}

/* And the summary number: how far off every assumption has to be, at the
   same time, each by the same fraction of its own value. */
function uniformBreakeven(dirs) {
  const cells = SHEET_BY_NAME['Assumptions'].cells;
  const v0 = {};
  DRIVERS.forEach(([, ref]) => v0[ref] = val('Assumptions', ref));
  const at = t => {
    const o = {};
    DRIVERS.forEach(([, ref], i) => {
      const d = cells[ref];
      o['Assumptions!' + ref] = Math.max(d.min, Math.min(d.max, v0[ref] * (1 + dirs[i] * t)));
    });
    return underScenario(o, NPV);
  };
  const gone = v => !isFinite(v) || v <= 0;
  if (gone(at(0))) return null;
  if (!gone(at(1))) return { out:true };
  /* on the answer, as above: NPV moves fast in t, so a tolerance on t alone
     would leave hundreds of thousands on the table */
  let a = 0, b = 1;
  for (let i = 0; i < 30; i++) {
    const m = (a + b) / 2, v = at(m);
    if (isFinite(v) && Math.abs(v) < EPS) return { t:m };
    if (gone(v)) b = m; else a = m;
  }
  return { t:(a + b) / 2 };
}

/* ═══════════════════════════════════════════════════════════════════════
   5. CHARTS
   Palette validated with the data-viz validator against a white surface:
   #2a78d6 / #eb6834 — CVD ΔE 24.7, normal-vision ΔE 33.6, both above floor.
   The page commits to one theme, so the charts do too.
   ═══════════════════════════════════════════════════════════════════════ */

/* round axis steps — 18/14/9/5/0 reads as an accident, 20/15/10/5/0 reads as a scale */
function niceScale(max, count) {
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top + step * 1e-9; v += step) ticks.push(v);
  return { top, ticks, step };
}

function drawCashflow() {
  const host = document.getElementById('cashflow');
  host.textContent = '';
  const W = 760, H = 236, ml = 42, mr = 8, mt = 14, mb = 26;
  const iw = W - ml - mr, ih = H - mt - mb;

  const data = YCOLS.map((c, i) => ({
    year:i + 1,
    ebitda:val('Model', c + '15'),
    ds:Math.abs(val('Model', c + '19')),
    dscr:val('Model', c + '24'),
  }));
  const peak = Math.max(...data.map(d => Math.max(d.ebitda, d.ds)), 1);
  const { top, ticks, step } = niceScale(peak * 1.08, 4);
  const y = v => mt + ih - (v / top) * ih;

  const svg = svgEl('svg', { class:'chart', viewBox:'0 0 ' + W + ' ' + H, role:'img',
    'aria-label':'EBITDA against debt service over twenty years. Year one EBITDA ' +
      formatValue(data[0].ebitda, 'num1') + ' million dollars against debt service ' +
      formatValue(data[0].ds, 'num1') + ' million, a cover ratio of ' + formatValue(data[0].dscr, 'x2') + '.' });

  const dp = step < 1 ? 2 : (Math.abs(step % 1) > 1e-9 ? 1 : 0);
  ticks.forEach(v => {
    const yy = y(v);
    svg.appendChild(svgEl('line', { class:'gridline', x1:ml, x2:W - mr, y1:yy, y2:yy }));
    const t = svgEl('text', { class:'tick ytick', x:ml - 7, y:yy + 3.5, 'text-anchor':'end' });
    t.textContent = v.toFixed(dp);
    svg.appendChild(t);
  });
  svg.appendChild(svgEl('line', { class:'axis', x1:ml, x2:W - mr, y1:y(0), y2:y(0) }));

  const band = iw / data.length;
  const bw = Math.max(5, Math.min(11, band / 2 - 2)), gap = 2;
  data.forEach((d, i) => {
    const cx = ml + band * i + band / 2;
    const pairs = [[cx - bw - gap / 2, d.ebitda, 'var(--series-1)']];
    if (d.ds > 0) pairs.push([cx + gap / 2, d.ds, 'var(--series-2)']);
    pairs.forEach(([x, v, fill]) => {
      const h = Math.max(1, y(0) - y(v));
      const r = svgEl('rect', { x, y:y(v), width:bw, height:h, fill, rx:4, ry:4 });
      /* square off the baseline end: rounding belongs to the data end only */
      const cover = svgEl('rect', { x, y:y(0) - Math.min(4, h), width:bw, height:Math.min(4, h), fill });
      const enter = ev => showTip(
        '<b>Year ' + d.year + '</b>EBITDA <i>' + formatValue(d.ebitda, 'num1') + '</i>' +
        (d.ds > 0 ? ' · Debt service <i>' + formatValue(d.ds, 'num1') + '</i><br>DSCR <i>' + formatValue(d.dscr, 'x2') + '</i>'
                  : '<br><i>debt repaid</i>'),
        ev.clientX, ev.clientY);
      [r, cover].forEach(el => {
        el.addEventListener('pointerenter', enter);
        el.addEventListener('pointermove', enter);
        el.addEventListener('pointerleave', hideTip);
      });
      svg.append(r, cover);
    });
    if (d.year === 1 || d.year % 5 === 0) {
      const lbl = svgEl('text', { class:'tick', x:cx, y:H - 9, 'text-anchor':'middle' });
      lbl.textContent = d.year;
      svg.appendChild(lbl);
    }
  });

  /* selective direct labels: first and last EBITDA only */
  [[0, data[0]], [data.length - 1, data[data.length - 1]]].forEach(([i, d]) => {
    const cx = ml + band * i + band / 2 - bw / 2 - 1;
    const t = svgEl('text', { class:'tick', x:cx, y:y(d.ebitda) - 6, 'text-anchor':'middle' });
    t.setAttribute('fill', 'var(--ink-2)');
    t.setAttribute('font-weight', '700');
    t.textContent = formatValue(d.ebitda, 'num1');
    svg.appendChild(t);
  });
  host.appendChild(svg);
}

/* diverging ramp, blue ↔ red with a neutral grey midpoint at NPV = 0 */
const RAMP_NEG = ['#f6c9c7', '#e07470', '#a93230'];
const RAMP_POS = ['#b7d3f6', '#5598e7', '#1c5cab'];
const MID = '#f0efec';
/* ── ranked sensitivity ──────────────────────────────────────────────
   A tornado laid out as a schedule. Every bar is a complete model run
   through underScenario(), not a derivative, so a clamped input or an
   unfinanceable corner shows up as itself instead of as a smooth line. */
/* The third field is the unit to print beside the value. The cells carry a
   `u` of their own, but it is a slider hint as often as a unit — "sizes the
   debt", "\u00a76418 transfer" — so the ones that are really units are named
   here.

   The fourth converts the cell's own value into the figure to show. Capex is
   dialled in $/kW, because it has to scale when the capacity slider moves,
   but $/kW is not the number anyone quotes a project in. It is shown as a
   total instead: dollars per kW, times the plant, in millions. */
const asTotal = { f:'num1', of:v => v * val('Assumptions', 'C9') / 1000 };
const DRIVERS = [
  ['PPA price, year 1',         'C13', '$/MWh'],
  ['Availability, steady state','C11', ''],
  ['Capex before contingency',  'C22', '$M', asTotal],
  ['Fuel contract ceiling',     'C17', '$/ton'],
  ['Non-fuel opex, year 1',     'C19', '$M'],
  ['Interest rate',             'C25', ''],
  ['PPA escalator',             'C14', ''],
  ['Target minimum DSCR',       'C24', ''],
  ['Contingency',               'C23', ''],
  ['Credit monetization',       'C34', ''],
];

function drawTornado() {
  const host = document.getElementById('tornado');
  if (!host) return;
  host.textContent = '';
  const base = val('Model', 'C55');
  if (!isFinite(base)) { host.appendChild($('p', 'none', 'Not financeable at these inputs, so there is nothing to rank.')); return; }

  const rows = DRIVERS.map(([lbl, ref]) => {
    const d = SHEET_BY_NAME['Assumptions'].cells[ref];
    const v0 = val('Assumptions', ref);
    /* clamp to the slider's own band: a 10% move on 91% availability is not
       100% availability, and pretending otherwise overstates the driver */
    const lo = Math.max(d.min, v0 * 0.9), hi = Math.min(d.max, v0 * 1.1);
    const f = x => underScenario({ ['Assumptions!' + ref]:x }, () => val('Model', 'C55'));
    const nlo = f(lo), nhi = f(hi);
    const dlo = isFinite(nlo) ? nlo - base : NaN;
    const dhi = isFinite(nhi) ? nhi - base : NaN;
    const swing = Math.max(isFinite(dlo) ? Math.abs(dlo) : 0, isFinite(dhi) ? Math.abs(dhi) : 0);
    return { lbl, ref, dlo, dhi, swing, clamped:(lo > v0 * 0.9 + 1e-12 || hi < v0 * 1.1 - 1e-12) };
  }).filter(r => r.swing > 0).sort((a, b) => b.swing - a.swing);

  if (!rows.length) { host.appendChild($('p', 'none', 'Nothing moves the answer at these inputs.')); return; }

  /* the axis runs symmetrically about the base case, on round steps, with
     enough headroom that the longest bar does not touch the end */
  const { top, step } = niceScale(rows[0].swing * 1.12, 2);
  const max = top;
  const dp = step < 1 ? 2 : (Math.abs(step % 1) > 1e-9 ? 1 : 0);
  const pos = d => 50 + (d / max) * 50;      /* $M change -> % across the track */

  const t = $('table', 'torn');
  const thead = $('thead'), htr = $('tr');
  htr.appendChild($('th', null, 'Assumption'));

  /* the axis lives in the header, so every bar below is read against it */
  const ax = $('th', 'c');
  const axw = $('div', 'tax');
  const dirs = $('div', 'taxdir');
  dirs.append($('span', 'w', 'worse'), $('span', null, 'Equity NPV, $M'), $('span', 'b', 'better'));
  axw.appendChild(dirs);
  const scale = $('div', 'taxs');
  const vals = [];
  for (let v = -top; v <= top + step * 1e-9; v += step) vals.push(v);
  vals.forEach((v, i) => {
    /* the ends align inward so they do not hang outside the cell, and the
       intermediate ticks are the ones a phone drops */
    const cls = v === 0 ? 'zero' : i === 0 ? 'edge l' : i === vals.length - 1 ? 'edge r' : 'mid';
    const k = $('span', cls);
    k.style.left = pos(v) + '%';
    k.textContent = v === 0 ? formatValue(base, 'num1') : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(dp);
    scale.appendChild(k);
  });
  axw.appendChild(scale);
  ax.appendChild(axw);
  htr.appendChild(ax);

  thead.appendChild(htr); t.appendChild(thead);

  const tb = $('tbody');
  rows.forEach(r => {
    const tr = $('tr');
    const l = $('td', 'lbl', r.lbl + (r.clamped ? ' · clamped' : ''));
    tr.appendChild(l);

    const bc = $('td', 'bar');
    const tbar = $('div', 'tb');
    [['lo', r.dlo], ['hi', r.dhi]].forEach(([side, d]) => {
      if (!isFinite(d) || d === 0) return;
      const wpc = Math.abs(d) / max * 50;
      /* red where equity NPV falls, green where it rises. Which side of the
         base case it lands on says the same thing again, so neither reading
         carries it alone. */
      const i = $('i', d >= 0 ? 'up' : 'dn');
      i.style.left = (d >= 0 ? 50 : 50 - wpc) + '%';
      i.style.width = wpc + '%';
      /* the exact figures used to be two columns beside the bar, which said
         them twice once the axis could be read. They live on the bar now. */
      i.dataset.side = side;
      i.dataset.d = d.toFixed(4);
      i.tabIndex = 0;
      const word = side === 'lo' ? 'If 10% low' : 'If 10% high';
      i.setAttribute('aria-label', r.lbl + '. ' + word + ', equity NPV ' +
        formatValue(base + d, 'num1') + ' million, ' + (d >= 0 ? 'up ' : 'down ') +
        formatValue(Math.abs(d), 'num1') + ' million.');
      const at = ev => {
        const b = i.getBoundingClientRect();
        showTip('<b>' + esc(r.lbl) + '</b>' + word + ' · equity NPV <i>' +
          formatValue(base + d, 'num1') + '</i><br>' + (d >= 0 ? 'up' : 'down') +
          ' <i>' + formatValue(Math.abs(d), 'num1') + '</i> from base',
          ev.clientX || b.left + b.width / 2, ev.clientY || b.top);
      };
      i.addEventListener('pointerenter', at);
      i.addEventListener('pointermove', at);
      i.addEventListener('pointerleave', hideTip);
      i.addEventListener('focus', at);
      i.addEventListener('blur', hideTip);
      tbar.appendChild(i);
    });
    tbar.appendChild($('u'));
    bc.appendChild(tbar);
    tr.appendChild(bc);
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  t.setAttribute('aria-label', 'Each assumption taken ten percent either way, ranked by how far ' +
    'equity NPV moves from its base of ' + formatValue(base, 'num1') + ' million dollars. ' +
    rows[0].lbl + ' moves it furthest.');
  host.appendChild(t);
}

function drawStress() {
  const host = document.getElementById('stress');
  if (!host) return;
  host.textContent = '';
  const head = document.getElementById('breakeven');
  const base = NPV();

  if (!isFinite(base) || base <= 0) {
    if (head) head.textContent = 'Equity NPV is already at or below zero at these inputs, so there is no room to measure.';
    return;
  }

  const dirs = DRIVERS.map(([, ref]) => adverseDir(ref));
  const rows = DRIVERS.map(([lbl, ref, unit, show], i) => {
    const d = SHEET_BY_NAME['Assumptions'].cells[ref];
    return { lbl, ref, unit, f:show ? show.f : d.f, show, v0:val('Assumptions', ref),
             dir:dirs[i], r:driverBreakeven(ref, dirs[i], base) };
  });
  /* least room first: the top row is the assumption to be most sure of */
  rows.sort((a, b) => {
    const ra = a.r && a.r.at !== undefined ? Math.abs(a.r.pct) : Infinity;
    const rb = b.r && b.r.at !== undefined ? Math.abs(b.r.pct) : Infinity;
    return ra - rb;
  });

  const all = uniformBreakeven(dirs);
  const tight = rows.find(r => r.r && r.r.at !== undefined);

  if (head) {
    head.textContent = '';
    delete head.dataset.t;
    if (all && all.t !== undefined) head.dataset.t = all.t;
    if (all && all.t !== undefined) {
      head.append('Every assumption would have to be ');
      head.appendChild($('b', null, formatValue(all.t, 'pct1') + ' worse than planned'));
      head.append(', all at once, to take equity NPV to zero.');
    } else {
      head.append('No uniform move within these ranges takes equity NPV to zero.');
    }
    if (tight) {
      head.append(' On its own, the tightest is ');
      head.appendChild($('b', null, tight.lbl.replace(/,.*$/, '')));
      head.append(', with ' + formatValue(Math.abs(tight.r.pct), 'pct1') + ' of room.');
    }
  }

  const t = $('table', 'sched stress');
  const thead = $('thead'), htr = $('tr');
  [['Assumption', ''], ['Planned', 'n'], ['Zero at', 'n'], ['Move', 'n']]
    .forEach(([h, c]) => htr.appendChild($('th', c, h)));
  thead.appendChild(htr); t.appendChild(thead);

  /* the unit is a property of the row, not of each figure in it: printing it
     in both value columns said it twice and cost the phone the width */
  const num = (v, r) => formatValue(r.show ? r.show.of(v) : v, r.f);
  const tb = $('tbody');
  rows.forEach(r => {
    const tr = $('tr');
    /* the solved figures, unrounded, so a check can put them back into the
       model and confirm they really do land on zero */
    tr.dataset.ref = r.ref;
    if (r.r && r.r.at !== undefined) { tr.dataset.at = r.r.at; tr.dataset.pct = r.r.pct; }
    else if (r.r && r.r.out) tr.dataset.survives = r.dir > 0 ? 'max' : 'min';
    const nm = $('td', null, r.lbl);
    if (r.unit) nm.append(' ', $('span', 'u', r.unit));
    tr.appendChild(nm);
    const p = $('td', 'n muted', num(r.v0, r));
    tr.appendChild(p);

    if (r.r && r.r.at !== undefined) {
      tr.appendChild($('td', 'n', num(r.r.at, r)));
      const m = $('td', 'n');
      m.textContent = (r.r.pct >= 0 ? '+' : '−') + formatValue(Math.abs(r.r.pct), 'pct1');
      /* under a tenth of its own value is not much room */
      if (Math.abs(r.r.pct) < 0.10) m.classList.add('bad');
      tr.appendChild(m);
    } else {
      const c = $('td', 'n muted wide2'); c.colSpan = 2;
      c.textContent = 'survives its whole range';
      tr.appendChild(c);
    }
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  t.setAttribute('aria-label', 'How far each assumption can move before equity NPV reaches zero, ' +
    'least room first.' + (tight ? ' ' + tight.lbl + ' has the least, at ' +
    formatValue(Math.abs(tight.r.pct), 'pct1') + '.' : ''));
  host.appendChild(t);
}

/* ═══════════════════════════════════════════════════════════════════════
   6. RECALC
   Headline figures update on every slider tick. The stress table, the
   sensitivity grid and the breakeven solve are debounced, since each of
   those is dozens of complete model evaluations.
   ═══════════════════════════════════════════════════════════════════════ */

let heavyTimer;

/* Some outputs are arithmetic rather than information at the edges of the input
   space, and printing them anyway is how a model tells a lie with a straight
   face. These say what is actually going on instead. */
function setDisplayOverrides() {
  const irrCell = document.querySelector('[data-cell="Model!C56"]');
  if (irrCell) {
    const irr = val('Model', 'C56'), eq = val('Model', 'C50'), fund = val('Model', 'C49');
    const thin = fund > 0 && eq / fund < 0.12;
    irrCell.dataset.override = (!isFinite(irr) || thin) ? 'n.m.' : irr > 1 ? 'over 100%' : '';
  }
  const dscrCell = document.querySelector('[data-cell="Model!C57"]');
  if (dscrCell) dscrCell.dataset.override = val('Model', 'C45') > 0 ? '' : 'no debt';
  const projCell = document.querySelector('[data-cell="Model!C63"]');
  if (projCell) {
    const pi = val('Model', 'C63');
    projCell.dataset.override = !isFinite(pi) ? 'n.m.' : pi > 1 ? 'over 100%' : '';
  }
}

function recalc() {
  cache = new Map();
  setDisplayOverrides();
  paintCells();

  document.querySelectorAll('[data-out]').forEach(o => {
    const [s, r] = o.dataset.out.split('!');
    o.textContent = txt(s, r);
    if (o.dataset.unit) o.appendChild($('span', 'u', o.dataset.unit));
  });
  const maxT = Math.max(...SITE.jobs.map(j => val('Career', 'F' + j.row)));
  document.querySelectorAll('[data-tbar]').forEach(b => {
    b.style.width = (val('Career', 'F' + b.dataset.tbar) / maxT * 100).toFixed(1) + '%';
  });

  const npvTile = document.querySelector('[data-tile="C55"]');
  if (npvTile) npvTile.classList.toggle('neg', val('Model', 'C55') < 0);

  const lev = document.getElementById('leverage');
  if (lev) lev.textContent = formatValue(val('Model', 'C51'), 'pct0');

  const badge = document.getElementById('tie');
  if (badge) {
    const flag = val('Model', 'C61');
    badge.textContent = flag === 'OK' ? '✓ all three pass'
      : flag === 'NOT FINANCEABLE' ? '✗ not financeable: EBITDA turns negative inside the tenor'
      : '✗ CHECK';
    badge.classList.toggle('bad', flag !== 'OK');
  }

  drawCashflow();

  clearTimeout(heavyTimer);
  heavyTimer = setTimeout(heavy, 130);
}

function heavy() {
  drawStress();      /* writes the headline as well as the table */
  drawTornado();
}

syncControls();
recalc();
clearSource();
recalc();
clearSource();
</script>

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/personal-website-financial-model-5jniwn
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Every run since this repo was created failed here with "Get Pages site
      # failed": Pages had never been switched on, and the action will not turn
      # it on by default. enablement lets the workflow do it itself, so the site
      # does not wait on somebody remembering a settings toggle.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish the site and nothing else. Uploading the repo root would put
      # README.md on the public domain, and the README is a build log: candid
      # notes on what was cut and why, and the reasoning behind what is held
      # back from the model. None of that belongs next to the proposal.
      - name: Stage the public files
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

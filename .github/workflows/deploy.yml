name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/personal-website-financial-model-5jniwn
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The gate. It needs no browser and no npm install, so it costs a couple of
      # seconds and can stand in front of every deploy. If it fails the job stops
      # here and the domain keeps serving the last good version, which is the
      # whole point: an edit made in the GitHub web editor cannot blank the live
      # site, and cannot put anything from the live transaction on it.
      - name: Guard
        run: node tests/guard.js

      # Every run in this repo has failed here with "Get Pages site failed",
      # because Pages has never been switched on. enablement: true was tried
      # and the token cannot do it: "Create Pages site failed. Resource not
      # accessible by integration." Enabling Pages needs admin rights that the
      # workflow token does not carry, so it is a genuine one-time manual step:
      # Settings -> Pages -> Source: GitHub Actions. Every run goes green after
      # that without anything else changing here.
      - uses: actions/configure-pages@v5

      # Publish the site and nothing else. Uploading the repo root would put
      # README.md on the public domain, and the README is a build log: candid
      # notes on what was cut and why, and the reasoning behind what is held
      # back from the model. None of that belongs next to the proposal.
      - name: Stage the public files
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
